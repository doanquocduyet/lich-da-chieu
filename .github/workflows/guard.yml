# Chốt chặn tự động cho mỗi lần index.html đổi — kể cả khi up file qua web GitHub.
#
# Bản build sinh từ nguồn ngoài repo luôn rơi mất 7 chỗ đã vá (đã lặp ở V2.4, V2.5).
# Workflow này tự vá lại, tự bump cache, rồi chạy kiểm tra thật trên trình duyệt.
# Không phải nhớ gì, không phải chạy gì ở máy.
#
# Cần bật: Settings > Actions > General > Workflow permissions
#          => "Read and write permissions"
# Không bật thì bước commit sẽ đỏ và báo 403.

name: guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'patch.py'
      - 'verify.js'
      - '.github/workflows/guard.yml'
      - 'seo/**'
  # Trang tĩnh phủ năm hiện tại -1..+1 (seo/build.js). Sang năm mới phải dựng lại
  # để dải năm dời theo — 01:00 UTC ngày 1/1 là 8 giờ sáng giờ Việt Nam.
  schedule:
    - cron: '0 1 1 1 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Không chạy lại trên chính commit mà workflow này vừa đẩy lên.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Vá lại 7 chỗ nếu bản build làm mất
        run: python3 patch.py index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cài Chromium
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      # Trang tĩnh lấy số liệu từ CHÍNH engine trong index.html, nên phải dựng lại
      # sau khi vá. Đầu ra xác định: engine không đổi thì không đổi một byte.
      - name: Dựng lại trang tĩnh (lịch âm / Phật / Tạng, trang ngày, sitemap)
        run: node seo/build.js

      # MỘT commit cho cả bản vá lẫn trang tĩnh. Vercel gói miễn phí giới hạn số
      # lần deploy mỗi ngày — đã chạm trần 25/9/2026 — nên không đẩy lắt nhắt.
      - name: Đẩy lên nếu có gì đổi
        id: fix
        run: |
          OUT="index.html sw.js sitemap.xml robots.txt llms.txt trang.css hom-nay.js du-lieu-ngay.js ngay thang lich-am lich-phat lich-tang"
          git add -A -- $OUT
          if git diff --cached --quiet; then
            echo "Không có gì đổi — bản vá và trang tĩnh đã khớp."
            echo "patched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Đã tự vá / dựng lại trang tĩnh — xem commit của github-actions[bot]."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tự động: vá lại + dựng lại trang tĩnh

          patch.py (7 chỗ vá, lớp SEO, dấu build) và seo/build.js. Xem §11
          và §39 trong BANGIAO-LICH-DA-CHIEU.md."
          git push
          echo "patched=true" >> "$GITHUB_OUTPUT"

      - name: Bảo GitHub Pages build lại
        # Đã đo thật (run 32557101481): Pages VẪN tự build khi bot đẩy bằng
        # GITHUB_TOKEN, tuy quy tắc chung là push bằng token đó không kích hoạt
        # workflow. Gọi thêm cho chắc — nếu Pages đã tự build thì GitHub tự huỷ
        # bản trùng, không hại gì; nếu có ngày nó thôi tự build thì bước này cứu.
        if: steps.fix.outputs.patched == 'true'
        run: |
          curl -sS -X POST -o /dev/null -w "yeu cau build Pages -> HTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages/builds" || true

      - name: Kiểm tra thật trên trình duyệt
        run: node verify.js

      - name: Kiểm tra lại mã nguồn còn đủ 7 chỗ vá
        run: python3 patch.py index.html --check

      - name: Kiểm tra trang tĩnh (thẻ, link, sitemap, số liệu khớp engine)
        run: node seo/check.js
