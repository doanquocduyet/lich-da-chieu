<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAF7F0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch Đa Chiều">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lịch Đa Chiều · Multi-Calendar</title>
<style>
  :root{
    --paper:#171717; --gold:#222; --gold-soft:#444;
    --violet:#555; --accent:#333; --jade:#555;
    --muted:#777; --line:#e5e5e5; --line2:#eeeeee;
    --card:#fff; --card2:#fafafa;
  }
  :root{color-scheme:light only;}
  html{color-scheme:light only;forced-color-adjust:none;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background:#f7f7f5 !important;
    color:#171717 !important;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden}
  /* lớp nền trắng vật lý — không host nào đè được */
  #bgfix{position:fixed;inset:0;background:#f7f7f5;z-index:-1;pointer-events:none}
  .wrap{background:#f7f7f5}
  .hero .dm{color:#171717 !important}
  .wk .c .g{color:#171717 !important}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff !important}
  .mgrid .d .g{color:#171717 !important}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff !important}
  .mnav .lbl{color:#171717 !important}
  .stars{display:none}
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;
    padding:20px 16px 120px;min-height:100vh}
  .top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 18px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .orb{font-size:19px;color:#222;text-shadow:none}
  .brand .nm{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#444;font-weight:600}
  .lang{display:flex;gap:2px;background:#eee;border-radius:18px;padding:3px}
  .lang button{background:none;border:none;color:#777;padding:5px 10px;border-radius:14px;font-family:inherit;font-size:11px;letter-spacing:.04em;cursor:pointer;transition:.2s}
  .lang button.on{background:#222;color:#fff;font-weight:600}
  .maintabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    background:#ededeb;padding:4px;border-radius:12px;margin-bottom:22px;
    position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}
  .maintabs button{background:none;border:none;color:#777;padding:11px 6px;
    border-radius:9px;font-family:inherit;font-size:13px;letter-spacing:0;cursor:pointer;
    transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .maintabs button .mi{font-size:17px;line-height:1}
  .maintabs button.on{background:#fff;color:#171717;box-shadow:0 1px 4px #00000010}
  .screen{display:none;animation:fade .25s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hero{text-align:center;padding:10px 0 6px}
  .hero .wd{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#777}
  .hero .dm{font-size:64px;line-height:.95;color:#111;font-weight:300;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .hero .mo{font-size:14px;color:#777;letter-spacing:0}
  .hero .lu{display:inline-block;margin-top:16px;font-size:14px;color:#222;padding:7px 16px;border:1px solid #d9d9d9;border-radius:20px;letter-spacing:0;background:#fff}
  .hero .cy{font-size:12px;color:#777;margin-top:10px;letter-spacing:0}
  .highlights{margin-top:26px}
  .hl-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;text-align:center;margin-bottom:12px}
  .hl{display:flex;align-items:center;gap:14px;padding:14px 15px;margin-bottom:8px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;cursor:pointer;transition:.2s}
  .hl:active{transform:scale(.99);background:#fafafa}
  .hl .em{font-size:23px;width:28px;text-align:center;flex-shrink:0;filter:grayscale(1)}
  .hl .tx{flex:1;min-width:0}
  .hl .tx .a{display:block;font-size:15px;color:#222;line-height:1.3}
  .hl .tx .b{display:block;font-size:12px;color:#888;margin-top:3px}
  .hl .go{color:#999;font-size:18px;opacity:.7}
  .picker{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 20px}
  .picker button{background:#fff;border:1px solid #ddd;color:#222;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:.2s}
  .picker button:active{transform:scale(.94);background:#f3f3f3}
  .picker input{background:#fff;border:1px solid #ddd;color:#222;font-family:inherit;font-size:14px;padding:8px 12px;border-radius:10px;text-align:center;color-scheme:light}
  .picker .tdy{font-size:11px;letter-spacing:.08em;padding:0 10px;width:auto;text-transform:uppercase;color:#333}
  .subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none;-ms-overflow-style:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:0 0 auto;background:#fff;border:1px solid #ddd;color:#777;padding:8px 15px;border-radius:20px;font-family:inherit;font-size:13px;letter-spacing:0;cursor:pointer;transition:.2s;white-space:nowrap}
  .subnav button.on{background:#222;color:#fff;border-color:#222;font-weight:500}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px 18px;margin-bottom:12px}
  .card h2{font-size:18px;font-weight:600;color:#222;letter-spacing:0}
  .card .en{font-size:10px;color:#888;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 16px}
  .big{font-size:42px;color:#171717;line-height:1.05;margin:6px 0 4px;font-weight:300;font-variant-numeric:tabular-nums}
  .big small{font-size:13px;color:#888;display:block;margin-top:8px;letter-spacing:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
  .row:last-child{border-bottom:none}
  .row .k{font-size:13px;color:#888;flex-shrink:0}
  .row .v{font-size:15px;color:#222;text-align:right}
  .row .v b{color:#222;font-weight:600}
  .row .v.jade b{color:#444}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .cell{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px 13px}
  .cell .cl{font-size:10px;color:#888;letter-spacing:.04em;text-transform:uppercase}
  .cell .cv{font-size:16px;color:#222;margin-top:5px}
  .cell .cv b{color:#222}
  .moonface{font-size:68px;text-align:center;margin:6px 0 2px;filter:grayscale(1)}
  .phase-name{text-align:center;color:#222;font-size:17px;margin-bottom:16px}
  .prog{height:6px;background:#eee;border-radius:8px;overflow:hidden;margin:14px 0 6px}
  .prog i{display:block;height:100%;background:#333;border-radius:8px}
  .tag{display:inline-block;font-size:11px;padding:4px 11px;border-radius:18px;letter-spacing:0;margin:2px 5px 2px 0}
  .tag.moon{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.event{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.jade{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .hours{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
  .hr{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:#fafafa;border:1px solid #eee}
  .hr.lucky{background:#f5f5f5;border-color:#ddd}
  .hr .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#bbb}
  .hr.lucky .dot{background:#333}
  .hr .hn{font-size:13px;color:#222}
  .hr .ht{font-size:11px;color:#888;margin-left:auto;font-variant-numeric:tabular-nums}
  .up .u{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
  .up .u:last-child{border:none}
  .up .u .un{color:#222}
  .up .u .ud{color:#555;font-variant-numeric:tabular-nums;flex-shrink:0;font-size:13px}
  .timeline{position:relative;margin:8px 0 4px;padding-left:8px}
  .tl{display:flex;gap:14px;align-items:flex-start;padding:9px 0;position:relative}
  .tl .tdot{width:10px;height:10px;border-radius:50%;background:#777;border:2px solid #fff;flex-shrink:0;margin-top:4px;box-shadow:0 0 0 1px #aaa}
  .tl.you .tdot{background:#222;box-shadow:0 0 0 1px #222}
  .tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:18px;bottom:-9px;width:1px;background:#ddd}
  .tl .tc{flex:1}
  .tl .tn{display:block;font-size:14px;color:#222}
  .tl.you .tn{color:#111;font-weight:600;letter-spacing:0}
  .tl .tt{display:block;font-size:12px;color:#888;margin-top:3px;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:#777;line-height:1.7;margin-top:16px;padding-top:15px;border-top:1px dashed #ddd;font-style:italic}
  /* — phân cấp chữ rõ hơn — */
  .hl .tx .a{font-size:17px;font-weight:600}
  /* — dải tuần (Hôm nay) — */
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 2px}
  .wk .c{text-align:center;padding:7px 0 6px;border-radius:12px;cursor:pointer}
  .wk .c .dw{font-size:10px;color:var(--muted);letter-spacing:.06em}
  .wk .c .g{font-size:15px;font-weight:600;margin-top:3px;color:var(--paper)}
  .wk .c .l{font-size:10px;color:var(--muted);margin-top:1px}
  .wk .c.today{background:var(--paper)}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff}
  /* — điều hướng tháng/năm — */
  .mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
  .mnav button{background:#fff;border:1px solid var(--line);color:var(--paper);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
  .mnav .lbl{flex:1;text-align:center;font-size:16px;font-weight:600;cursor:pointer;color:var(--paper)}
  .mnav .tdy{width:auto;padding:0 12px;font-size:12px;height:34px}
  .ypanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .ypanel .yrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
  .ypanel .yrow b{font-size:18px}
  .ypanel .yrow button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--paper)}
  .ypanel .mm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ypanel .mm button{padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer;color:var(--paper)}
  .ypanel .mm button.on{background:var(--paper);color:#fff;border-color:var(--paper)}
  .ypanel .goto{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
  .ypanel .goto input{background:#fff;border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:13px;padding:6px 10px;border-radius:10px}
  /* — lưới tháng — */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .mgrid .hd{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;letter-spacing:.05em}
  .mgrid .d{min-height:48px;border-radius:10px;text-align:center;padding:5px 0 3px;cursor:pointer;background:#fff;border:1px solid var(--line2)}
  .mgrid .d .g{font-size:14.5px;font-weight:600;line-height:1.15;color:var(--paper)}
  .mgrid .d .l{font-size:9.5px;color:var(--muted);line-height:1.25}
  .mgrid .d .l.b{color:var(--paper);font-weight:700}
  .mgrid .d .ev{width:4px;height:4px;border-radius:50%;background:var(--paper);margin:3px auto 0}
  .mgrid .d.today{background:var(--paper);border-color:var(--paper)}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff}
  .mgrid .d.today .ev{background:#fff}
  .mgrid .d.sel{box-shadow:inset 0 0 0 1.5px var(--paper)}
  .legend{font-size:11px;color:var(--muted);text-align:center;margin:10px 0 16px}
  .mnav input{background:#fff;border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:14px;padding:8px 10px;border-radius:12px;flex:1;text-align:center;color-scheme:light}
  .ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .ymon{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:8px 6px;cursor:pointer}
  .ymon .yt{font-size:11.5px;font-weight:700;margin-bottom:4px;color:var(--paper)}
  .ymon .yc{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .ymon .yc i{font-style:normal;font-size:8px;color:var(--muted);text-align:center;line-height:1.6}
  .ymon .yc i.td{background:var(--paper);color:#fff;border-radius:50%}
  /* ═══ V2 THEME: kem + mực + đỏ trầm + ngọc ═══ */
  :root{--ink:#1C1B18;--cream:#FAF7F0;--red:#8C2F2F;--jade2:#6F9585;--bd:#EDE6D8}
  html,body{background:var(--cream) !important;color:var(--ink) !important}
  #bgfix{background:var(--cream) !important}
  .wrap{background:var(--cream);padding-bottom:100px}
  .card,.hl,.cell,.hr,.mgrid .d,.ymon{border-color:var(--bd)}
  .maintabs{display:none}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(255,253,248,.95);backdrop-filter:blur(14px);border-top:1px solid var(--bd);
    padding:7px 4px calc(9px + env(safe-area-inset-bottom))}
  .bnav button{background:none;border:none;font-family:inherit;color:#8A8577;font-size:10.5px;
    display:flex;flex-direction:column;gap:3px;align-items:center;padding:4px 0;cursor:pointer}
  .bnav button .bi{font-size:20px;line-height:1}
  .bnav button.on{color:var(--red);font-weight:700}
  .wk .c.today,.mgrid .d.today{background:var(--red) !important;border-color:var(--red) !important}
  .mgrid .d.sel{box-shadow:inset 0 0 0 1.5px var(--red)}
  .mgrid .d .ev{background:var(--red)}
  .mgrid .d.sun .g,.wk .c.sun .g{color:var(--red) !important}
  .mgrid .d.today .g,.wk .c.today .g{color:#fff !important}
  .mgrid .hd:last-child{color:var(--red);opacity:.8}
  .ymon .yc i.td{background:var(--red)}
  .hr.lucky{background:#6F958514;border-color:#6F958540}
  .hr.lucky .dot{background:var(--jade2)}
  .subnav button.on,.lang button.on{background:var(--ink);border-color:var(--ink)}
  .mnav .tdy{color:var(--red)}
  .ccstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--bd);
    border-radius:16px;padding:13px 6px;margin:18px 0 0}
  .ccstrip .cc{text-align:center}
  .ccstrip .cl{font-size:9.5px;letter-spacing:.14em;color:#8A8577}
  .ccstrip .cv{font-size:17px;font-weight:700;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .ccstrip .cn{font-size:11px;color:var(--red);margin-top:2px}
  .backbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .backbar button{background:#fff;border:1px solid var(--bd);border-radius:12px;height:38px;padding:0 14px;
    font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
  .backbar .bt{font-size:15px;font-weight:700;color:var(--ink)}
  .evmonth{font-size:11.5px;letter-spacing:.16em;color:#8A8577;margin:20px 2px 8px;text-transform:uppercase}
  .evrow{display:flex;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:14px;
    padding:11px 13px;margin-bottom:8px;align-items:center;cursor:pointer}
  .evrow .ed{min-width:54px;text-align:center;background:var(--red);color:#fff;border-radius:10px;padding:6px 4px}
  .evrow .ed .d1{font-size:15px;font-weight:800;line-height:1.15}
  .evrow .ed .d2{font-size:9.5px;opacity:.9}
  .evrow .et{flex:1;min-width:0}
  .evrow .et .n{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.3}
  .evrow .et .s{margin-top:4px}
  .badge{display:inline-block;font-size:9px;letter-spacing:.06em;border:1px solid #E3DCCB;color:#8A8577;
    border-radius:8px;padding:2px 7px;margin-right:4px;text-transform:uppercase}
  .badge.tib{color:var(--red);border-color:#8C2F2F44}
  .cvmode{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
  .cvmode::-webkit-scrollbar{display:none}
  .cvmode button{flex:0 0 auto;background:#fff;border:1px solid var(--bd);color:#6B6559;padding:9px 14px;
    border-radius:20px;font-family:inherit;font-size:13px;cursor:pointer}
  .cvmode button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cvin{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
  .cvin .ttl{font-size:10.5px;letter-spacing:.14em;color:#8A8577;text-transform:uppercase;margin-bottom:10px}
  .cvin .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  .cvin select,.cvin input{width:100%;background:var(--cream);border:1px solid #E9E2D4;border-radius:10px;
    padding:11px 10px;font-family:inherit;font-size:14px;color:var(--ink);color-scheme:light}
  .cvin label.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#6B6559;margin-top:10px}
  .cvbtn{width:100%;background:var(--red);color:#fff;border:none;border-radius:14px;padding:14px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin:2px 0 14px}
  .sharebtn{width:100%;background:#fff;border:1px solid var(--bd);color:var(--ink);border-radius:14px;
    padding:12px;font-family:inherit;font-size:14px;cursor:pointer;margin-top:12px}
  /* ═══ V2.1 COMFORT: chạm ≥44px, số to như app lịch phổ biến, chữ dễ đọc ═══ */
  :root{--red:#B03A30;--muted:#6E6A5E}
  body{font-size:16px}
  .lang{padding:4px}
  .lang button{padding:9px 16px;font-size:13px}
  .bnav{padding:9px 4px calc(10px + env(safe-area-inset-bottom))}
  .bnav button{font-size:11px;gap:4px;color:#6E6A5E}
  .bnav button .bi{font-size:23px}
  .bnav button.on{color:var(--red)}
  .subnav button,.cvmode button{padding:12px 18px;font-size:14.5px;min-height:44px}
  .mnav button{width:44px;height:44px;font-size:19px;border-radius:14px}
  .mnav .tdy{height:44px;padding:0 16px;font-size:13.5px}
  .mnav .lbl{font-size:17.5px}
  .wk{gap:5px}
  .wk .c{padding:9px 0 8px;border-radius:13px}
  .wk .c .dw{font-size:11px}
  .wk .c .g{font-size:18px}
  .wk .c .l{font-size:11.5px;margin-top:2px}
  .mgrid{gap:4px}
  .mgrid .hd{font-size:12px;padding:6px 0}
  .mgrid .d{min-height:62px;padding:8px 0 5px;border-radius:12px}
  .mgrid .d .g{font-size:19px}
  .mgrid .d .l{font-size:12px;margin-top:1px}
  .mgrid .d .ev{width:5px;height:5px;margin-top:4px}
  .legend{font-size:12.5px}
  .ygrid{gap:9px}
  .ymon{padding:10px 7px}
  .ymon .yt{font-size:13px}
  .ymon .yc i{font-size:9.5px;line-height:1.7}
  .ccstrip{padding:15px 6px}
  .ccstrip .cl{font-size:10.5px;color:#6E6A5E}
  .ccstrip .cv{font-size:20px}
  .ccstrip .cn{font-size:13px;margin-top:3px}
  .hl{padding:17px 16px}
  .hl .tx .a{font-size:17.5px}
  .hl .tx .b{font-size:13.5px;margin-top:4px;color:#6E6A5E}
  .hl .em{font-size:28px;width:34px}
  .hl .go{font-size:20px}
  .card h2{font-size:20px}
  .row{padding:13px 0}
  .row .k{font-size:14px;color:#6E6A5E}
  .row .v{font-size:16px}
  .big{font-size:46px}

function sunLong(jdn){

// Pha trăng theo Meeus (ch.46–48) — đối chiếu khớp ephem đến 0,1%
function moonAt(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let D=297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868;
  let M=357.5291092+35999.0502909*T-0.0001536*T*T;

    -1.274*Math.sin(2*Dr-Mpr)-0.658*Math.sin(2*Dr)
    -0.214*Math.sin(2*Mpr)-0.110*Math.sin(Dr);
  i=((i%360)+360)%360;
  const illum=(1+Math.cos(i*dr))/2;
  // pha tăng khi kinh độ lệch (D) trong 0..180
  const Dn=((D%360)+360)%360;
  const waxing=Dn<180;
  let idx;
  if(illum<0.02)idx=0;else if(illum>0.98)idx=4;
  else if(waxing)idx=illum<0.46?1:(illum<0.54?2:3);

// sóc/vọng thật quanh 1 ngày (dò theo góc pha)
function findPhase(fromJd,target){ // target: 180 = sóc, 0 = vọng
  const f=jd=>{const a=moonAt(jd).angle;
    if(target===180)return a-180;
    return a>180?a-360:a;};
  let prev=f(fromJd),jd=fromJd;
  for(let i=1;i<=40;i++){
    const cur=f(fromJd+i);
    if(prev<0&&cur>=0||prev<=0&&cur>0){ // đổi dấu -> khoảng chứa nghiệm
      let lo=fromJd+i-1,hi=fromJd+i;
      for(let k=0;k<40;k++){const mid=(lo+hi)/2;(f(mid)<0)?lo=mid:hi=mid;}

  return{idx:nextIdx,days:15};
}

// ═══════════════ COSMIC (theo ngày xem) ═══════════════
const UAGE=13.8e9;
const cosmicEv=[[13.8e9,"bigBang"],[13.6e9,"milkyWay"],[4.6e9,"solarSys"],[3.8e9,"lifeEarth"],[6.6e7,"dino"],[3e5,"human"]];
function yearsAgoToCosmic(ya){
  let frac=(UAGE-ya)/UAGE,doy=frac*365.25;
  let d=new Date(2000,0,1);d.setDate(d.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  return{date:d,hh,mm,doy};
}
// map ngày đang xem -> vị trí trong "năm vũ trụ"
function cosmicForDate(date){
  let y0=new Date(date.getFullYear(),0,1),y1=new Date(date.getFullYear()+1,0,1);
  let frac=(date-y0)/(y1-y0);
  // cosmic date = same fraction of the cosmic year
  let doy=frac*365.25;
  let cd=new Date(2000,0,1);cd.setDate(cd.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  // years since big bang at this fraction
  let ysbb=frac*UAGE;
  return{date:cd,hh,mm,frac,ysbb};
}

// ═══════════════ TIBETAN (Phugpa thật — thuật toán Janson, thư viện tibetan-date-calculator MIT) ═══════════════
const TDC=window.tibetanCalendarCalculator;
const tibElVi={Wood:"Mộc",Fire:"Hỏa",Earth:"Thổ",Iron:"Kim",Water:"Thủy"};
const tibAnVi={Mouse:"Chuột",Ox:"Trâu",Tiger:"Hổ",Rabbit:"Thỏ",Dragon:"Rồng",Snake:"Rắn",Horse:"Ngựa",Sheep:"Cừu",Monkey:"Khỉ",Bird:"Chim",Dog:"Chó",Pig:"Lợn"};
const tibGenVi={Male:"dương",Female:"âm"};
function tibetan(date){
  const iso=date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate());
  const td=new TDC.TibetanDate(iso),m=td.getMonthObj(),y=td.getYearObj();
  return{year:y.tibYearNum,month:m.month,leap:!!m.isLeapMonth,day:td.getDate(),
    leapDay:!!td.isLeapDay,gender:y.gender,element:y.element,animal:y.animal};
}
function tibYearShort(tib){
  return LANG=='vi'?`${tibElVi[tib.element]} ${tibAnVi[tib.animal]}`:`${tib.element} ${tib.animal}`;
}
let LOCNAME=(function(){try{return localStorage.getItem('ldc_locname')||''}catch(e){return''}})();
// §0 từ vựng khóa: dùng "Hỏa Ngựa" — KHÔNG dùng "Hỏa Ngựa (dương)" / "Male Fire Horse".
// Âm/dương của năm hiển thị riêng ở dòng "Tính năm" trong panel Lịch Tạng.
function tibYearName(tib){return tibYearShort(tib);}
// 4 Düchen lớn + Losar: [tháng Tạng, ngày Tạng, khóa i18n]
const DUCHEN=[[1,1,'losar'],[1,15,'duchen1'],[4,15,'duchen2'],[6,4,'duchen3'],[9,22,'duchen4']];
function drukSpecialName(tib,t){
  if(!tib.leap)for(const e of DUCHEN)if(tib.month===e[0]&&tib.day===e[1])return t[e[2]];
  return t.drukDays[String(tib.day)]||null;
}
function drukUpcoming(d,t){
  const base=tibetan(d).year,ref=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),list=[];
  for(let yy=base;yy<=base+1;yy++)for(const e of DUCHEN){
    try{
      const td=new TDC.TibetanDate({year:yy,month:e[0],day:e[1]});
      const w=new Date(td.westernDateStr+'T12:00:00');
      const diff=Math.round((w-ref)/864e5);
      if(diff>=0&&diff<=380)list.push([diff,t[e[2]],td.westernDateStr]);
    }catch(err){}
  }
  list.sort((a,b)=>a[0]-b[0]);return list.slice(0,5);
}

function daysToLunarDay(d,target){
  for(let i=0;i<60;i++){let x=new Date(d);x.setDate(x.getDate()+i);
    let l=solarToLunar(x.getDate(),x.getMonth()+1,x.getFullYear(),7);if(l.day===target)return i;}
  return -1;
}
function daysToLunarDate(d,lm,ld){
  for(let i=0;i<400;i++){let x=new Date(d);x.setDate(x.getDate()+i);
    let l=solarToLunar(x.getDate(),x.getMonth()+1,x.getFullYear(),7);if(l.month===lm&&l.day===ld)return i;}
  return -1;
}

// tìm nước lớn/ròng từ chuỗi giờ
function tideExtremes(j){
  const tm=j.hourly.time,h=j.hourly.sea_level_height_msl,out=[];
  const now=new Date();
  for(let i=1;i<h.length-1;i++){
    if(h[i]==null||h[i-1]==null||h[i+1]==null)continue;
    const hi=h[i]>=h[i-1]&&h[i]>=h[i+1],lo=h[i]<=h[i-1]&&h[i]<=h[i+1];
    if(!hi&&!lo)continue;
    const d=new Date(tm[i]);
    if(d<now)continue;
    if(out.length&&out[out.length-1].hi===hi)continue;
    out.push({hi,d,v:h[i]});
    if(out.length>=6)break;
  }
  return out;
}
function tideSpark(j){
  const tm=j.hourly.time,h=j.hourly.sea_level_height_msl;
  const n=Math.min(h.length,48),vals=[];
  for(let i=0;i<n;i++)vals.push(h[i]==null?0:h[i]);
  const mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(n-1)*320).toFixed(1)},${(82-(v-mn)/sp*66).toFixed(1)}`).join(' ');
  const now=new Date(),i0=Math.max(0,Math.min(n-1,Math.round((now-new Date(tm[0]))/36e5)));
  const nx=(i0/(n-1)*320).toFixed(1),ny=(82-(vals[i0]-mn)/sp*66).toFixed(1);
  return `<svg class="tidegraph" viewBox="0 0 320 90" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#6F9585" stroke-width="2.5"/>
    <circle cx="${nx}" cy="${ny}" r="4" fill="#B03A30"/>
  </svg>`;
}
function tideRegime(t){
  const age=moonPhase(new Date()).age;

  const dQtr=Math.min(Math.abs(age-7.38),Math.abs(age-22.15));
  if(dSyz<=2.5)return t.tideSpring;
  if(dQtr<=2.5)return t.tideNeap;
  return t.tideMid;
}

function moonLon(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let Lp=218.3164477+481267.88123421*T-0.0015786*T*T;
  let D=(297.8501921+445267.1114034*T-0.0018819*T*T)*dr;
  let M=(357.5291092+35999.0502909*T)*dr;
  let Mp=(134.9633964+477198.8675055*T+0.0087414*T*T)*dr;
  let F=(93.2720950+483202.0175233*T-0.0036539*T*T)*dr;
  let s=6288774*Math.sin(Mp)+1274027*Math.sin(2*D-Mp)+658314*Math.sin(2*D)
    +213618*Math.sin(2*Mp)-185116*Math.sin(M)-114332*Math.sin(2*F)
    +58793*Math.sin(2*D-2*Mp)+57066*Math.sin(2*D-M-Mp)+53322*Math.sin(2*D+Mp)
    +45758*Math.sin(2*D-M)-40923*Math.sin(M-Mp)-34720*Math.sin(D)
    -30383*Math.sin(M+Mp)+15327*Math.sin(2*D-2*F)-12528*Math.sin(Mp+2*F)
    +10980*Math.sin(Mp-2*F);
  return (((Lp+s/1e6)%360)+360)%360;
}

function dailyLine(d,t){
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const tb=tibetan(d),mp=moonPhase(d);
  const jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  // 1) ngày thực hành Tạng
  const tl=!tb.leap&&LINES.tibet[String(tb.day)];
  if(tl)return{txt:tl[LANG],lens:t.lensTibet,src:t.srcEdited,go:()=>'goExp(3)'};
  // 2) rằm / mùng 1 → Phật giáo (câu có nguồn)
  if(lun.day===15||lun.day===1){
    const q=LINES.buddha[jd%LINES.buddha.length];
    return{txt:'“'+q[LANG]+'”',lens:t.lensBuddha,src:LANG=='vi'?q.src:q.srcEn,go:()=>'goExp(2)'};
  }
  // 3) ngày bắt đầu tiết khí → Lịch Việt
  const ct=currentTermIdx(jd),ctY=currentTermIdx(jd-1);
  if(ct!==ctY)return{txt:t.lineTerm.replace('{t}',t.terms[ct]),lens:t.lensViet,src:t.srcEdited,go:()=>'goExp(0)'};
  // 4) mặc định → thiên văn
  let k='wax';
  if(mp.illum>0.985)k='full';else if(mp.illum<0.015)k='newm';else k=mp.waxing?'wax':'wane';
  return{txt:LINES.astro[k][LANG],lens:t.lensAstro,src:t.srcEdited,go:()=>'goExp(0)'};
}

    <div class="dl-src">${L.lens} · ${L.src}</div>
  </div>`;
}

  let lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  let be=d.getFullYear()+544;
  let isFull=lun.day===15,isNew=lun.day===1;
  let todayEv=t.buddhaEv.find(e=>e[0]===lun.month&&e[1]===lun.day);
  let up=[];
  for(let ev of t.buddhaEv){let dd=daysToLunarDate(d,ev[0],ev[1]);if(dd>=0&&dd<=380)up.push([dd,ev[2]]);}
  up.sort((a,b)=>a[0]-b[0]);up=up.slice(0,7);
  let tags='';
  if(isFull)tags+=`<span class="tag moon">☾ ${t.fullDay}</span>`;
  if(isNew)tags+=`<span class="tag moon">● ${t.newDay}</span>`;
  if(todayEv)tags+=`<span class="tag event">✦ ${todayEv[2]}</span>`;
  const jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  const q=LINES.buddha[jd%LINES.buddha.length];
  return `<div class="idc bud">
    <div class="hd2">
      ${ornLotus(56,'#C9922E')}
      <div class="k2">${t.buddhaEra}</div>
      <div class="v2">${be}</div>
      <div class="s2">${LANG=='vi'?'Ngày '+lun.day+' tháng '+lun.month+' âm lịch':'Lunar '+lun.day+'/'+lun.month}</div>
      ${tags?`<div style="margin-top:12px">${tags}</div>`:''}
    </div>
    <div class="bd2">
      ${(!isFull&&!isNew&&!todayEv)?`<div class="note" style="border:none;margin:0 0 6px;padding:0">${t.noBuddhaEv}</div>`:''}
      <div class="qbox">
        ${ornWheel(30,'#C9922E')}
        <div class="qtx">“${q[LANG]}”</div>
        <div class="qsrc">${LANG=='vi'?q.src:q.srcEn}</div>
      </div>
      <div class="note">${t.buddhaMean}</div>
    </div>
  </div>
  <div class="card">
    <h2>${t.upcoming}</h2><div class="en">${LANG=='vi'?'12 tháng tới':'Next 12 months'}</div>
    <div class="up">${up.map(u=>`<div class="u"><span class="un">${u[1]}</span><span class="ud">${u[0]===0?t.today:u[0]+' '+(LANG=='vi'?'ngày':'d')}</span></div>`).join('')}</div>
  </div>`;
}

function panelCosmic(){
  const t=T[LANG],mn=t.moShort;
  let evs=cosmicEv.map(e=>{let cc=yearsAgoToCosmic(e[0]);return{key:e[1],doy:cc.doy,date:cc.date,hh:cc.hh,mm:cc.mm};});
  let items=evs.map(e=>({key:e.key,doy:e.doy,label:t[e.key],date:e.date,hh:e.hh,mm:e.mm,you:false}));
  items.push({key:'you',doy:365.999,label:t.youHere,fixed:true,you:true});
  items.sort((a,b)=>a.doy-b.doy);
  function cd(it){return it.fixed?`31 ${mn[11]} · 23:59:59`:`${it.date.getDate()} ${mn[it.date.getMonth()]} · ${pad(it.hh)}:${pad(it.mm)}`;}
  return `<div class="idc cos">
    <div class="hd2" style="position:relative">
      ${ornOrbit()}
      <div style="position:relative">
        <div class="k2">Cosmic Calendar · Carl Sagan</div>
        <div class="v2">31 ${mn[11]}<br>23:59:59</div>
        <div class="s2">${t.youHere}</div>
      </div>
    </div>
    <div class="bd2">
      <div class="row"><span class="k">${t.cosmicSince}</span><span class="v"><b>13,80 ${LANG=='vi'?'tỷ năm':'Gyr'}</b></span></div>
      <div class="row"><span class="k">${LANG=='vi'?'1 ngày vũ trụ':'1 cosmic day'}</span><span class="v">≈ 37,8 ${LANG=='vi'?'triệu năm':'Myr'}</span></div>
      <div class="row"><span class="k">${LANG=='vi'?'1 giây vũ trụ':'1 cosmic second'}</span><span class="v">≈ 438 ${LANG=='vi'?'năm':'yr'}</span></div>
      <div class="qbox cosq"><div class="qtx">${LINES.cosmic[LANG]}</div><div class="qsrc">${t.lensCosmic} · ${t.srcEdited}</div></div>
    </div>
  </div>
  <div class="card">
    <h2>${LANG=='vi'?'Dòng thời gian vũ trụ':'Cosmic timeline'}</h2>
    <div class="en">${LANG=='vi'?'Toàn bộ lịch sử trong 1 năm':'All of history in one year'}</div>
    <div class="timeline">${items.map(it=>`
      <div class="tl ${it.you?'you':''}"><span class="tdot"></span>
        <span class="tc"><span class="tn">${it.label}</span><span class="tt">${cd(it)}</span></span></div>`).join('')}</div>
  </div>`;
}

function panelAstro(){
  let d=VIEW,t=T[LANG];
  let mp=moonPhase(d),season=getSeason(d),nt=nextTerm(d);
  let curTerm=currentTermIdx(jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear()));
  const nf=nextFullMoon(d),nn=nextNewMoon(d);
  return `<div class="idc moon">
    <div class="hd2" style="position:relative">
      ${ornHalo()}
      <div style="position:relative">
        <div class="k2">${t.moonLbl}</div>
        <div style="display:flex;justify-content:center;margin:16px 0 10px">${moonSVG(mp.illum,mp.waxing,104)}</div>
        <div class="v2" style="font-size:26px">${t.phases[mp.idx]}</div>
        <div class="s2">${Math.round(mp.illum*100)}% ${t.illum.toLowerCase()} · ${t.moonAgeShort.replace('{n}',Math.round(mp.age))}</div>
      </div>
    </div>
    <div class="bd2">
      <div class="row"><span class="k">${t.illum}</span><span class="v"><b>${Math.round(mp.illum*100)}%</b></span></div>
      <div class="row"><span class="k">${t.moonAge}</span><span class="v">${mp.age.toFixed(1)} ${t.days}</span></div>
      <div class="row"><span class="k">${t.nextFullM}</span><span class="v"><b>${nf.getDate()}/${nf.getMonth()+1}</b> · ${pad(nf.getHours())}:${pad(nf.getMinutes())}</span></div>
      <div class="row"><span class="k">${t.nextNewM}</span><span class="v">${nn.getDate()}/${nn.getMonth()+1} · ${pad(nn.getHours())}:${pad(nn.getMinutes())}</span></div>
      <div class="note">${mp.waxing?t.moonMean:t.moonMeanW}<br>${t.moonNote}</div>
    </div>
  </div>
  <div class="card">
    <h2>${t.seasonTitle}</h2><div class="en">${LANG=='vi'?'Mùa & 24 tiết khí':'Season & 24 solar terms'}</div>
    <div class="big" style="font-size:30px">${t.terms[curTerm]}<small>${t.seasons[season]} · ${LANG=='vi'?'tiết khí hiện tại':'current solar term'}</small></div>
    <div class="row"><span class="k">${t.nextTerm}</span><span class="v"><b>${t.terms[nt.idx]}</b> · ${LANG=='vi'?'còn':''} ${nt.days} ${t.days}</span></div>
    <div class="note">${t.termMean}</div>
  </div>`;
}

  let up=drukUpcoming(d,t);
  const ey=elementYoga(d),y28=yoga28(d);
  return `<div class="idc tib">
    ${ornLungta()}
    <div class="hd2">

      <div class="v2">${LANG=='vi'?'Ngày ':'Day '}${tib.day}${tib.leapDay?'*':''}</div>
      <div class="s2">${LANG=='vi'?'Tháng':'Month'} ${monLabel} · ${tib.year} · ${yn}</div>
      ${special?`<div style="margin-top:12px"><span class="tag jade">✦ ${special}</span></div>`:''}

    ${ornMountain('#2E3446','#3A4157')}
    <div class="bd2">
      <div class="row"><span class="k">${t.drukYear}</span><span class="v"><b>${tib.year}</b> · ${yn}</span></div>
      <div class="row"><span class="k">${t.tibGender}</span><span class="v">${tib.gender==='Male'?t.gMale:t.gFemale}</span></div>
      <div class="row"><span class="k">${t.tibSystem}</span><span class="v">${t.tibSystemV}</span></div>
      ${special?`<div class="note">${t.sacredMean}</div>`:''}
    </div>
  </div>
  ${ey?`<div class="idc elc">
    <div class="hd2">
      ${ornKnot(34,'#D4A017')}
      <div class="k2">${t.yogaTitle}</div>
      <div class="elpair">
        <div class="elone"><i style="background:${EL_COLOR[ey.a]}"></i><span>${ey.elA}</span><em>${t.elFromWd}</em></div>
        <div class="elplus">+</div>
        <div class="elone"><i style="background:${EL_COLOR[ey.b]}"></i><span>${ey.elB}</span><em>${t.elFromNak}</em></div>
      </div>
      <div class="elname ${ey.good?'g':'b'}">${ey.mean}</div>
      <div class="eltib">${ey.tib} · ${ey.skt}</div>
    </div>
    <div class="bd2">
      <div class="explain">${t.yogaExplain
        .replace('{wd}',t.weekdays[VIEW.getDay()])
        .replace('{ea}',ey.elA.toLowerCase())
        .replace('{nak}',ey.nak)
        .replace('{eb}',ey.elB.toLowerCase())
        .replace('{name}',ey.mean.toLowerCase())}</div>
      <div class="explain2">${t.yogaUse}</div>
      <div class="row"><span class="k">${t.yoga28}</span><span class="v"><b>${y28.mean}</b> · <i style="color:#9A8358">${y28.tib}</i></span></div>
      <div class="row"><span class="k">${t.yogaNak}</span><span class="v">${ey.nak}</span></div>
      <div class="note">${t.yogaNote}</div>
    </div>
  </div>`:''}
  <div class="card">
    <h2>${t.upcoming}</h2><div class="en">Düchen · Losar</div>
    <div class="up">${up.map(u=>`<div class="u"><span class="un">${u[1]}</span><span class="ud">${u[0]===0?t.today:u[0]+' '+(LANG=='vi'?'ngày':'d')}</span></div>`).join('')}</div>
    <div class="note">${t.drukNote}</div>

// ═══════════════ NAV / CONTROLS ═══════════════
function renderMainTabs(){
  let t=T[LANG],ic=["◈","▦","⇄","☸","✧"],mt=document.getElementById('maintabs');
  mt.innerHTML=t.mains.map((m,i)=>
    `<button class="${i===MAIN?'on':''}" onclick="setMain(${i})"><span class="bi">${ic[i]}</span>${m}</button>`).join('');
}
function renderScreen(){
  let fns=[screenToday,screenCalendar,screenConvert,screenEvents,screenExplore];
  document.getElementById('screens').innerHTML=`<div class="screen on">${fns[MAIN]()}</div>`;
}
function setMain(i){if(i===0){VIEW=new Date();syncGYM();}if(i!==1)DETAIL=false;MAIN=i;track('tab_open',['today','calendar','convert','events','explore'][i]);renderMainTabs();renderScreen();window.scrollTo(0,0);}
function setSubCal(i){SUBCAL=i;track('tab_open','calendar:'+['vannien','canchi','buddha'][i]);renderScreen();}
function setSubExp(i){SUBEXP=i;track('tab_open','explore:'+['moon','cosmic','buddha','tibet','weather','tide'][i]);renderScreen();}
function goCal(i){SUBCAL=i;setMain(1);}
function goExp(i){SUBEXP=i;setMain(4);}

function shiftDay(n){VIEW=new Date(VIEW.getTime()+n*864e5);syncGYM();track('date_select','arrow');renderScreen();}
function pickDate(){let v=document.getElementById('dp').value;if(v){VIEW=new Date(v+'T12:00:00');syncGYM();track('date_select','picker');renderScreen();}}

function setLang(l){
  LANG=l;track('language_change',l);
  document.getElementById('lvi').classList.toggle('on',l=='vi');
  document.getElementById('len').classList.toggle('on',l=='en');
  document.getElementById('brandName').textContent=T[l].brand;
  document.getElementById('footNote').textContent=T[l].foot;
  document.documentElement.lang=l;
  renderMainTabs();renderScreen();
}

// stars
(function(){let s=document.getElementById('stars'),h='';
  for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s"></i>`;
  s.innerHTML=h;})();

document.getElementById('footNote').textContent=T.vi.foot;
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
trackVisit();
if(loadLoc()){fetchWeather();fetchTide();}
renderMainTabs();renderScreen();
</script>
