<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAF7F0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch Đa Chiều">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lịch Đa Chiều · Multi-Calendar</title>
<style>
  :root{
    --paper:#171717; --gold:#222; --gold-soft:#444;
    --violet:#555; --accent:#333; --jade:#555;
    --muted:#777; --line:#e5e5e5; --line2:#eeeeee;
    --card:#fff; --card2:#fafafa;
  }
  :root{color-scheme:light only;}
  html{color-scheme:light only;;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background:#f7f7f5 !important;
    color:#171717 !important;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden}
  /* lớp nền trắng vật lý — không host nào đè được */
  #bgfix{position:fixed;inset:0;background:#f7f7f5;z-index:-1;pointer-events:none}
  .wrap{background:#f7f7f5}
  .hero .dm{color:#171717 !important}
  .wk .c .g{color:#171717 !important}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff !important}
  .mgrid .d .g{color:#171717 !important}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff !important}
  .mnav .lbl{color:#171717 !important}
  .stars{display:none}
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;
    padding:20px 16px 120px;min-height:100vh}
  .top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 18px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .orb{font-size:19px;color:#222;text-shadow:none}
  .brand .nm{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#444;font-weight:600}
  .lang{display:flex;gap:2px;background:#eee;border-radius:18px;padding:3px}
  .lang button{background:none;border:none;color:#777;padding:5px 10px;border-radius:14px;font-family:inherit;font-size:11px;letter-spacing:.04em;cursor:pointer;transition:.2s}
  .lang button.on{background:#222;color:#fff;font-weight:600}
  .maintabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    background:#ededeb;padding:4px;border-radius:12px;margin-bottom:22px;
    position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}
  .maintabs button{background:none;border:none;color:#777;padding:11px 6px;
    border-radius:9px;font-family:inherit;font-size:13px;letter-spacing:0;cursor:pointer;
    transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .maintabs button .mi{font-size:17px;line-height:1}
  .maintabs button.on{background:#fff;color:#171717;box-shadow:0 1px 4px #00000010}
  .screen{display:none;animation:fade .25s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hero{text-align:center;padding:10px 0 6px}
  .hero .wd{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#777}
  .hero .dm{font-size:64px;line-height:.95;color:#111;font-weight:300;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .hero .mo{font-size:14px;color:#777;letter-spacing:0}
  .hero .lu{display:inline-block;margin-top:16px;font-size:14px;color:#222;padding:7px 16px;border:1px solid #d9d9d9;border-radius:20px;letter-spacing:0;background:#fff}
  .hero .cy{font-size:12px;color:#777;margin-top:10px;letter-spacing:0}
  .highlights{margin-top:26px}
  .hl-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;text-align:center;margin-bottom:12px}
  .hl{display:flex;align-items:center;gap:14px;padding:14px 15px;margin-bottom:8px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;cursor:pointer;transition:.2s}
  .hl:active{transform:scale(.99);background:#fafafa}
  .hl .em{font-size:23px;width:28px;text-align:center;flex-shrink:0;filter:grayscale(1)}
  .hl .tx{flex:1;min-width:0}
  .hl .tx .a{display:block;font-size:15px;color:#222;line-height:1.3}
  .hl .tx .b{display:block;font-size:12px;color:#888;margin-top:3px}
  .hl .go{color:#999;font-size:18px;opacity:.7}
  .picker{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 20px}
  .picker button{background:#fff;border:1px solid #ddd;color:#222;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:.2s}
  .picker button:active{transform:scale(.94);background:#f3f3f3}
  .picker input{background:#fff;border:1px solid #ddd;color:#222;font-family:inherit;font-size:14px;padding:8px 12px;border-radius:10px;text-align:center;color-scheme:light}
  .picker .tdy{font-size:11px;letter-spacing:.08em;padding:0 10px;width:auto;text-transform:uppercase;color:#333}
  .subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none;-ms-overflow-style:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:0 0 auto;background:#fff;border:1px solid #ddd;color:#777;padding:8px 15px;border-radius:20px;font-family:inherit;font-size:13px;letter-spacing:0;cursor:pointer;transition:.2s;white-space:nowrap}
  .subnav button.on{background:#222;color:#fff;border-color:#222;font-weight:500}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px 18px;margin-bottom:12px}
  .card h2{font-size:18px;font-weight:600;color:#222;letter-spacing:0}
  .card .en{font-size:10px;color:#888;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 16px}
  .big{font-size:42px;color:#171717;line-height:1.05;margin:6px 0 4px;font-weight:300;font-variant-numeric:tabular-nums}
  .big small{font-size:13px;color:#888;display:block;margin-top:8px;letter-spacing:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
  .row:last-child{border-bottom:none}
  .row .k{font-size:13px;color:#888;flex-shrink:0}
  .row .v{font-size:15px;color:#222;text-align:right}
  .row .v b{color:#222;font-weight:600}
  .row .v.jade b{color:#444}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .cell{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px 13px}
  .cell .cl{font-size:10px;color:#888;letter-spacing:.04em;text-transform:uppercase}
  .cell .cv{font-size:16px;color:#222;margin-top:5px}
  .cell .cv b{color:#222}
  .moonface{font-size:68px;text-align:center;margin:6px 0 2px;filter:grayscale(1)}
  .phase-name{text-align:center;color:#222;font-size:17px;margin-bottom:16px}
  .prog{height:6px;background:#eee;border-radius:8px;overflow:hidden;margin:14px 0 6px}
  .prog i{display:block;height:100%;background:#333;border-radius:8px}
  .tag{display:inline-block;font-size:11px;padding:4px 11px;border-radius:18px;letter-spacing:0;margin:2px 5px 2px 0}
  .tag.moon{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.event{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.jade{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .hours{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
  .hr{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:#fafafa;border:1px solid #eee}
  .hr.lucky{background:#f5f5f5;border-color:#ddd}
  .hr .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#bbb}
  .hr.lucky .dot{background:#333}
  .hr .hn{font-size:13px;color:#222}
  .hr .ht{font-size:11px;color:#888;margin-left:auto;font-variant-numeric:tabular-nums}
  .up .u{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
  .up .u:last-child{border:none}
  .up .u .un{color:#222}
  .up .u .ud{color:#555;font-variant-numeric:tabular-nums;flex-shrink:0;font-size:13px}
  .timeline{position:relative;margin:8px 0 4px;padding-left:8px}
  .tl{display:flex;gap:14px;align-items:flex-start;padding:9px 0;position:relative}
  .tl .tdot{width:10px;height:10px;border-radius:50%;background:#777;border:2px solid #fff;flex-shrink:0;margin-top:4px;box-shadow:0 0 0 1px #aaa}
  .tl.you .tdot{background:#222;box-shadow:0 0 0 1px #222}
  .tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:18px;bottom:-9px;width:1px;background:#ddd}
  .tl .tc{flex:1}
  .tl .tn{display:block;font-size:14px;color:#222}
  .tl.you .tn{color:#111;font-weight:600;letter-spacing:0}
  .tl .tt{display:block;font-size:12px;color:#888;margin-top:3px;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:#777;line-height:1.7;margin-top:16px;padding-top:15px;border-top:1px dashed #ddd;font-style:italic}
  /* — phân cấp chữ rõ hơn — */
  .hl .tx .a{font-size:17px;font-weight:600}
  /* — dải tuần (Hôm nay) — */
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 2px}
  .wk .c{text-align:center;padding:7px 0 6px;border-radius:12px;cursor:pointer}
  .wk .c .dw{font-size:10px;color:var(--muted);letter-spacing:.06em}
  .wk .c .g{font-size:15px;font-weight:600;margin-top:3px;color:var(--paper)}
  .wk .c .l{font-size:10px;color:var(--muted);margin-top:1px}
  .wk .c.today{background:var(--paper)}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff}
  /* — điều hướng tháng/năm — */
  .mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
  .mnav button{background:#fff;border:1px solid var(--line);color:var(--paper);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
  .mnav .lbl{flex:1;text-align:center;font-size:16px;font-weight:600;cursor:pointer;color:var(--paper)}
  .mnav .tdy{width:auto;padding:0 12px;font-size:12px;height:34px}
  .ypanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .ypanel .yrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
  .ypanel .yrow b{font-size:18px}
  .ypanel .yrow button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--paper)}
  .ypanel .mm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ypanel .mm button{padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer;color:var(--paper)}
  .ypanel .mm button.on{background:var(--paper);color:#fff;border-color:var(--paper)}
  .ypanel .goto{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
  .ypanel .goto input{background:#fff;border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:13px;padding:6px 10px;border-radius:10px}
  /* — lưới tháng — */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .mgrid .hd{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;letter-spacing:.05em}
  .mgrid .d{min-height:48px;border-radius:10px;text-align:center;padding:5px 0 3px;cursor:pointer;background:#fff;border:1px solid var(--line2)}
  .mgrid .d .g{font-size:14.5px;font-weight:600;line-height:1.15;color:var(--paper)}
  .mgrid .d .l{font-size:9.5px;color:var(--muted);line-height:1.25}
  .mgrid .d .l.b{color:var(--paper);font-weight:700}
  .mgrid .d .ev{width:4px;height:4px;border-radius:50%;background:var(--paper);margin:3px auto 0}
  .mgrid .d.today{background:var(--paper);border-color:var(--paper)}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff}
  .mgrid .d.today .ev{background:#fff}
  .mgrid .d.sel{box-shadow:inset 0 0 0 1.5px var(--paper)}
  .legend{font-size:11px;color:var(--muted);text-align:center;margin:10px 0 16px}
  .mnav input{background:#fff;border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:14px;padding:8px 10px;border-radius:12px;flex:1;text-align:center;color-scheme:light}
  .ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .ymon{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:8px 6px;cursor:pointer}
  .ymon .yt{font-size:11.5px;font-weight:700;margin-bottom:4px;color:var(--paper)}
  .ymon .yc{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .ymon .yc i{font-style:normal;font-size:8px;color:var(--muted);text-align:center;line-height:1.6}
  .ymon .yc i.td{background:var(--paper);color:#fff;border-radius:50%}
  /* ═══ V2 THEME: kem + mực + đỏ trầm + ngọc ═══ */
  :root{--ink:#1C1B18;--cream:#FAF7F0;--red:#8C2F2F;--jade2:#6F9585;--bd:#EDE6D8}
  html,body{background:var(--cream) !important;color:var(--ink) !important}
  #bgfix{background:var(--cream) !important}
  .wrap{background:var(--cream);padding-bottom:100px}
  .card,.hl,.cell,.hr,.mgrid .d,.ymon{border-color:var(--bd)}
  .maintabs{display:none}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(255,253,248,.95);backdrop-filter:blur(14px);border-top:1px solid var(--bd);
    padding:7px 4px calc(9px + env(safe-area-inset-bottom))}
  .bnav button{background:none;border:none;font-family:inherit;color:#8A8577;font-size:10.5px;
    display:flex;flex-direction:column;gap:3px;align-items:center;padding:4px 0;cursor:pointer}
  .bnav button .bi{font-size:20px;line-height:1}
  .bnav button.on{color:var(--red);font-weight:700}
  .wk .c.today,.mgrid .d.today{background:var(--red) !important;border-color:var(--red) !important}
  .mgrid .d.sel{box-shadow:inset 0 0 0 1.5px var(--red)}
  .mgrid .d .ev{background:var(--red)}
  .mgrid .d.sun .g,.wk .c.sun .g{color:var(--red) !important}
  .mgrid .d.today .g,.wk .c.today .g{color:#fff !important}
  .mgrid .hd:last-child{color:var(--red);opacity:.8}
  .ymon .yc i.td{background:var(--red)}
  .hr.lucky{background:#6F958514;border-color:#6F958540}
  .hr.lucky .dot{background:var(--jade2)}
  .subnav button.on,.lang button.on{background:var(--ink);border-color:var(--ink)}
  .mnav .tdy{color:var(--red)}
  .ccstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--bd);
    border-radius:16px;padding:13px 6px;margin:18px 0 0}
  .ccstrip .cc{text-align:center}
  .ccstrip .cl{font-size:9.5px;letter-spacing:.14em;color:#8A8577}
  .ccstrip .cv{font-size:17px;font-weight:700;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .ccstrip .cn{font-size:11px;color:var(--red);margin-top:2px}
  .backbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .backbar button{background:#fff;border:1px solid var(--bd);border-radius:12px;height:38px;padding:0 14px;
    font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
  .backbar .bt{font-size:15px;font-weight:700;color:var(--ink)}
  .evmonth{font-size:11.5px;letter-spacing:.16em;color:#8A8577;margin:20px 2px 8px;text-transform:uppercase}
  .evrow{display:flex;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:14px;
    padding:11px 13px;margin-bottom:8px;align-items:center;cursor:pointer}
  .evrow .ed{min-width:54px;text-align:center;background:var(--red);color:#fff;border-radius:10px;padding:6px 4px}
  .evrow .ed .d1{font-size:15px;font-weight:800;line-height:1.15}
  .evrow .ed .d2{font-size:9.5px;opacity:.9}
  .evrow .et{flex:1;min-width:0}
  .evrow .et .n{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.3}
  .evrow .et .s{margin-top:4px}
  .badge{display:inline-block;font-size:9px;letter-spacing:.06em;border:1px solid #E3DCCB;color:#8A8577;
    border-radius:8px;padding:2px 7px;margin-right:4px;text-transform:uppercase}
  .badge.tib{color:var(--red);border-color:#8C2F2F44}
  .cvmode{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
  .cvmode::-webkit-scrollbar{display:none}
  .cvmode button{flex:0 0 auto;background:#fff;border:1px solid var(--bd);color:#6B6559;padding:9px 14px;
    border-radius:20px;font-family:inherit;font-size:13px;cursor:pointer}
  .cvmode button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cvin{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
  .cvin .ttl{font-size:10.5px;letter-spacing:.14em;color:#8A8577;text-transform:uppercase;margin-bottom:10px}
  .cvin .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  .cvin select,.cvin input{width:100%;background:var(--cream);border:1px solid #E9E2D4;border-radius:10px;
    padding:11px 10px;font-family:inherit;font-size:14px;color:var(--ink);color-scheme:light}
  .cvin label.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#6B6559;margin-top:10px}
  .cvbtn{width:100%;background:var(--red);color:#fff;border:none;border-radius:14px;padding:14px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin:2px 0 14px}
  .sharebtn{width:100%;background:#fff;border:1px solid var(--bd);color:var(--ink);border-radius:14px;
    padding:12px;font-family:inherit;font-size:14px;cursor:pointer;margin-top:12px}
  /* ═══ V2.1 COMFORT: chạm ≥44px, số to như app lịch phổ biến, chữ dễ đọc ═══ */
  :root{--red:#B03A30;--muted:#6E6A5E}
  body{font-size:16px}
  .lang{padding:4px}
  .lang button{padding:9px 16px;font-size:13px}
  .bnav{padding:9px 4px calc(10px + env(safe-area-inset-bottom))}
  .bnav button{font-size:11px;gap:4px;color:#6E6A5E}
  .bnav button .bi{font-size:23px}
  .bnav button.on{color:var(--red)}
  .subnav button,.cvmode button{padding:12px 18px;font-size:14.5px;min-height:44px}
  .mnav button{width:44px;height:44px;font-size:19px;border-radius:14px}
  .mnav .tdy{height:44px;padding:0 16px;font-size:13.5px}
  .mnav .lbl{font-size:17.5px}
  .wk{gap:5px}
  .wk .c{padding:9px 0 8px;border-radius:13px}
  .wk .c .dw{font-size:11px}
  .wk .c .g{font-size:18px}
  .wk .c .l{font-size:11.5px;margin-top:2px}
  .mgrid{gap:4px}
  .mgrid .hd{font-size:12px;padding:6px 0}
  .mgrid .d{min-height:62px;padding:8px 0 5px;border-radius:12px}
  .mgrid .d .g{font-size:19px}
  .mgrid .d .l{font-size:12px;margin-top:1px}
  .mgrid .d .ev{width:5px;height:5px;margin-top:4px}
  .legend{font-size:12.5px}
  .ygrid{gap:9px}
  .ymon{padding:10px 7px}
  .ymon .yt{font-size:13px}
  .ymon .yc i{font-size:9.5px;line-height:1.7}
  .ccstrip{padding:15px 6px}
  .ccstrip .cl{font-size:10.5px;color:#6E6A5E}
  .ccstrip .cv{font-size:20px}
  .ccstrip .cn{font-size:13px;margin-top:3px}
  .hl{padding:17px 16px}
  .hl .tx .a{font-size:17.5px}
  .hl .tx .b{font-size:13.5px;margin-top:4px;color:#6E6A5E}
  .hl .em{font-size:28px;width:34px}
  .hl .go{font-size:20px}
  .card h2{font-size:20px}
  .row{padding:13px 0}
  .row .k{font-size:14px;color:#6E6A5E}
  .row .v{font-size:16px}
  .big{font-size:46px}
  .hero .wd{font-size:14px}

  .qsrc{font-size:12.5px;color:#9A8358;letter-spacing:.04em}
  .idc.elc{border-color:#E0CFA4}
  .idc.elc .hd2{background:linear-gradient(168deg,#FFF8E9 0%,#F7EAD0 100%);text-align:center;padding:20px 18px 22px}
  .idc.elc .k2{color:#9A7B3A;margin-top:8px}
  .idc.elc .bd2{background:#FFFDF8;border-top:2px solid #E8D6AC}
  .elpair{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin:16px 0 6px}
  .elone{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:82px}
  .elone i{width:44px;height:44px;border-radius:50%;border:2px solid #00000012;box-shadow:0 3px 10px -3px #0000002e}
  .elone span{font-size:19px;font-weight:800;color:#4A3A1E}
  .elone em{font-size:11.5px;font-style:normal;color:#9A7B3A;line-height:1.35;text-align:center}
  .elplus{font-size:22px;color:#B79A5E;margin-top:12px}
  .elname{font-size:30px;font-weight:800;margin-top:12px;letter-spacing:-.01em}
  .elname.g{color:#4E7565}
  .elname.b{color:#B03A30}
  .eltib{font-size:13px;color:#9A7B3A;font-style:italic;margin-top:3px}
  .explain{font-size:15.5px;line-height:1.68;color:#3E3524;margin-bottom:12px}
  .explain2{font-size:14px;line-height:1.65;color:#6E6248;background:#FBF6EA;border-left:3px solid #D4A017;
    padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:6px}
  .orn{display:block;width:100%;height:34px}
  .lotus{display:block;margin:0 auto 2px}
  /* Dòng của ngày */
  .dline{margin:22px 2px 14px;padding:20px 4px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
    text-align:center;cursor:pointer}
  .dl-ttl{font-size:11px;letter-spacing:.24em;color:#9A9384;text-transform:uppercase}
  .dl-tx{font-size:18.5px;line-height:1.55;color:var(--ink);margin:14px 6px 12px;font-weight:500}
  .dl-src{font-size:12.5px;color:#9A9384}
  .cntdn{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#B03A300d;border:1px solid #B03A3028;border-radius:16px;padding:14px 16px;
    margin-bottom:10px;cursor:pointer}
  .cntdn .cd-n{font-size:14.5px;font-weight:700;color:#8C2A20}
  .cntdn .cd-d{font-size:13.5px;color:#6E6A5E}
  .cntdn .cd-d b{color:#B03A30;font-size:16px}
  .sharebtn{display:block;width:100%;margin-top:12px;padding:15px;border-radius:16px;
    border:1px solid var(--bd);background:#fff;color:#1C1B18;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer}
  .sharebtn:active{background:#F3EEE3}
  .wxbtn{padding:11px 16px;border-radius:12px;border:1px solid #C9D8DE;background:#fff;
    font-size:14.5px;font-family:inherit;color:#26414C;cursor:pointer;font-weight:600}
  .wxbtn.alt{background:none;font-weight:500;color:#5E7480}
  #cityForm input{width:100%;padding:12px;border:1px solid #C9D8DE;border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
  /* Trực thần trên Hôm nay */
  .hdbar{display:flex;align-items:center;gap:9px;padding:12px 15px;border-radius:14px;margin-top:14px;
    background:#F2EFE6;border:1px solid var(--bd);cursor:pointer;font-size:15px}
  .hdbar .hdd2{width:9px;height:9px;border-radius:50%;background:#C3BDB0;flex-shrink:0}
  .hdbar.g{background:#FBF2E2;border-color:#EAD6AE}
  .hdbar.g .hdd2{background:#E8A33D}
  .hdbar .hdt{font-weight:700;color:var(--ink)}
  .hdbar .hdv{margin-left:auto;font-size:13.5px;color:#6E6A5E}
  .hdbar.g .hdv{color:#B07E27}
  .wk .c{position:relative}
  .wk .c.hdg::after{content:'';position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:#E8A33D}
  .wk .c.today.hdg::after{background:#FFD79A}
  .tspan{font-size:13.5px;line-height:1.65;color:#6E6A5E;padding:12px 0 2px;margin-top:6px;border-top:1px dashed #E4DCCB}
  .tsrc{display:block;font-size:12px;color:#9A9384;margin-top:3px}
  .tspan.cos{color:#9A92C8;border-top-color:#ffffff1f}
  body.sk-tib .tspan{color:#D8C4A0;border-top-color:#ffffff26}
  body.sk-tib .tsrc{color:#B79A72}
  body.sk-bud .tspan{color:#8A7A5C;border-top-color:#E4D9BF}
  .spbox{margin-top:14px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 16px 6px}
  .sptt{font-size:11px;letter-spacing:.2em;color:#9A9384;text-transform:uppercase;margin-bottom:10px}
  .spit{padding:10px 0;border-bottom:1px solid #F2ECE0;cursor:pointer}
  .spit:last-child{border:0}
  .spn{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.35}
  .sps{display:block;font-size:13.5px;color:#6E6A5E;margin-top:3px}
  .hub.wx.slim{padding:15px 17px}
  .hub.wx.slim .lbl{font-size:11px}
  .gl{font-style:normal;font-size:13px;color:#B5AE9E;cursor:pointer;padding:0 2px}
  #glo{position:fixed;inset:0;background:#1C1B1866;display:none;align-items:flex-end;z-index:90}
  #glo.on{display:flex}
  .glbox{width:100%;background:#FDFCF8;border-radius:22px 22px 0 0;padding:22px 20px 26px;
    box-shadow:0 -8px 30px -10px #00000040}
  .glt{font-size:19px;font-weight:750;color:var(--ink);margin-bottom:8px}
  .glx{font-size:15.5px;line-height:1.7;color:#4A4438}
  .glbox button{margin-top:16px;width:100%;padding:13px;background:none;border:1px solid var(--bd);
    border-radius:12px;font-size:15px;font-family:inherit;color:#6E6A5E;cursor:pointer}
  .more{margin-top:12px;background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden}
  .more summary{padding:15px 16px;font-size:15px;color:#6E6A5E;cursor:pointer;list-style:none;
    display:flex;align-items:center;justify-content:space-between}
  .more summary::-webkit-details-marker{display:none}
  .more summary::after{content:'⌄';font-size:17px;color:#B5AE9E}
  .more[open] summary::after{content:'⌃'}
  .more .mbody{padding:0 4px 4px}
  .more .rmbox{border:0;background:none;padding:0 12px 12px}
  .rmtop{background:#FDF6F5;border:1px solid #F0DCD9;border-radius:14px;padding:10px 15px;margin-top:12px;cursor:pointer}
  /* Ghi chú giỗ/sinh nhật */
  .rmbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .rmrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid #F2ECE0}
  .rmn{font-size:15px;color:#8C2F2F}
  .rmn b{color:var(--ink)}
  .rmd{font-size:13px;color:#6E6A5E;text-align:right;flex-shrink:0}
  .rmadd{width:100%;margin-top:6px;padding:12px;background:none;border:1.5px dashed #D8CFBC;border-radius:12px;
    font-size:14.5px;color:#8A8577;font-family:inherit;cursor:pointer}
  #noteForm{margin-top:12px;padding-top:12px;border-top:1px solid #F0EADD}
  #noteForm input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit;background:#FDFCF8;margin-bottom:8px}
  .nfrow{display:flex;gap:8px;margin-bottom:8px}
  .nfrow select{flex:1;padding:11px 8px;border:1px solid var(--bd);border-radius:12px;font-size:14.5px;font-family:inherit;background:#FDFCF8}
  .nfsave{flex:1;padding:12px;background:var(--ink);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .nfcancel{flex:1;padding:12px;background:none;border:1px solid var(--bd);border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;color:#6E6A5E}
  .nflist{margin-top:10px;padding-top:8px;border-top:1px dashed #E4DCCB}
  .nfitem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;color:#4A4438}
  .nfitem button{background:none;border:0;color:#B03A30;font-size:15px;cursor:pointer;padding:4px 8px}
  /* Ngày mai */
  .tmr{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
    border:1px solid var(--bd);border-radius:16px;padding:15px 16px;cursor:pointer}
  .tmr .tm-l{font-size:14.5px;font-weight:700;color:var(--ink);flex-shrink:0}
  .tmr .tm-r{font-size:13px;color:#6E6A5E;text-align:right}
  footer{text-align:center;font-size:10px;color:#999;margin-top:30px;letter-spacing:.04em;line-height:1.8;opacity:1}

// ═══════════════ LUNAR (Hồ Ngọc Đức) ═══════════════
const PI=Math.PI;
function jdFromDate(dd,mm,yy){
  let a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;
  let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;
  return jd;
}
function newMoon(k){
  let T=k/1236.85,T2=T*T,T3=T2*T,dr=PI/180;
  let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  let M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  let Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  let F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C+=-0.4068*Math.sin(Mp*dr)+0.0161*Math.sin(dr*2*Mp)-0.0004*Math.sin(dr*3*Mp);
  C+=0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mp))-0.0074*Math.sin(dr*(M-Mp));
  C+=0.0004*Math.sin(dr*(2*F+M))-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mp));
  C+=0.0010*Math.sin(dr*(2*F-Mp))+0.0005*Math.sin(dr*(2*Mp+M));
  let dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
  return J+C-dt;
}
function sunLong(jdn){
  let T=(jdn-2451545)/36525,T2=T*T,dr=PI/180;
  let M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  let L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  let L=(L0+DL)*dr;return L-PI*2*Math.floor(L/(PI*2));
}
function getSunLong(d,tz){return Math.floor(sunLong(d-0.5-tz/24)/PI*6);}
function getNMDay(k,tz){return Math.floor(newMoon(k)+0.5+tz/24);}
function getLM11(yy,tz){
  let off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853),nm=getNMDay(k,tz);
  if(getSunLong(nm,tz)>=9)nm=getNMDay(k-1,tz);
  return nm;
}
function getLeapOff(a11,tz){
  let k=Math.floor((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1,arc=getSunLong(getNMDay(k+i,tz),tz);
  do{last=arc;i++;arc=getSunLong(getNMDay(k+i,tz),tz);}while(arc!=last&&i<14);
  return i-1;
}
function solarToLunar(dd,mm,yy,tz){
  tz=tz||7;
  let dn=jdFromDate(dd,mm,yy),k=Math.floor((dn-2415021.076998695)/29.530588853);
  let ms=getNMDay(k+1,tz);if(ms>dn)ms=getNMDay(k,tz);
  let a11=getLM11(yy,tz),b11=a11,ly;
  if(a11>=ms){ly=yy;a11=getLM11(yy-1,tz);}else{ly=yy+1;b11=getLM11(yy+1,tz);}
  let ld=dn-ms+1,diff=Math.floor((ms-a11)/29),leap=0,lm=diff+11;
  if(b11-a11>365){let lo=getLeapOff(a11,tz);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1;}}
  if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;
  return{day:ld,month:lm,year:ly,leap:leap,jd:dn};
}

// ═══════════════ ASTRO (theo ngày xem) ═══════════════
// Pha trăng theo Meeus (ch.46–48) — đối chiếu khớp ephem đến 0,1%
function moonAt(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let D=297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868;
  let M=357.5291092+35999.0502909*T-0.0001536*T*T;
  let Mp=134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699;
  const Dr=D*dr,Mr=M*dr,Mpr=Mp*dr;
  let i=180-D-6.289*Math.sin(Mpr)+2.100*Math.sin(Mr)
    -1.274*Math.sin(2*Dr-Mpr)-0.658*Math.sin(2*Dr)
    -0.214*Math.sin(2*Mpr)-0.110*Math.sin(Dr);
  i=((i%360)+360)%360;
  const illum=(1+Math.cos(i*dr))/2;
  // pha tăng khi kinh độ lệch (D) trong 0..180
  const Dn=((D%360)+360)%360;
  const waxing=Dn<180;
  let idx;
  if(illum<0.02)idx=0;else if(illum>0.98)idx=4;
  else if(waxing)idx=illum<0.46?1:(illum<0.54?2:3);
  else idx=illum>0.54?5:(illum>0.46?6:7);
  return{illum,idx,waxing,angle:i};
}
// jd tại thời điểm cụ thể (giờ ICT)
function jdAt(date,hourICT){
  return jdFromDate(date.getDate(),date.getMonth()+1,date.getFullYear())-0.5+(hourICT-7)/24;
}
// sóc/vọng thật quanh 1 ngày (dò theo góc pha)
function findPhase(fromJd,target){ // target: 0 = sóc (không trăng), 180 = vọng (trăng tròn)
  const f=jd=>{const a=moonAt(jd).angle;
    if(target===180)return a-180;
    return a>180?a-360:a;};
  let prev=f(fromJd),jd=fromJd;
  for(let i=1;i<=40;i++){
    const cur=f(fromJd+i);
    if(prev<0&&cur>=0||prev<=0&&cur>0){ // đổi dấu -> khoảng chứa nghiệm
      let lo=fromJd+i-1,hi=fromJd+i;
      for(let k=0;k<40;k++){const mid=(lo+hi)/2;(f(mid)<0)?lo=mid:hi=mid;}
      return (lo+hi)/2;
    }
    prev=cur;
  }
  return null;   // không tìm được nghiệm: báo rõ, không trả số xấp xỉ
}
function jdToDateObj(jd){
  const z=Math.floor(jd+0.5),f=jd+0.5-z;
  let a=z;
  if(z>=2299161){const al=Math.floor((z-1867216.25)/36524.25);a=z+1+al-Math.floor(al/4);}
  const b=a+1524,c=Math.floor((b-122.1)/365.25),d2=Math.floor(365.25*c),e=Math.floor((b-d2)/30.6001);
  const day=b-d2-Math.floor(30.6001*e)+f;
  const mo=e<14?e-1:e-13,yr=mo>2?c-4716:c-4715;
  const dd=Math.floor(day),hrs=(day-dd)*24+7; // về giờ ICT
  const dt=new Date(yr,mo-1,dd);dt.setHours(Math.floor(hrs),Math.round((hrs%1)*60));
  return dt;
}
// API cũ giữ nguyên tên: mặc định lấy 12:00 ICT của ngày đang xem
function moonPhase(date,hourICT){
  const h=(hourICT==null)?12:hourICT;
  const jd=jdAt(date,h);
  const m=moonAt(jd);
  const lastNew=findPhase(jd-30,0);
  const age=jd-lastNew;
  return{age:age<0?age+29.53:age,idx:m.idx,illum:m.illum,waxing:m.waxing,jd};
}
function nextNewMoon(date){const j=findPhase(jdAt(date,12)+1,0);return j==null?null:jdToDateObj(j);}
function nextFullMoon(date){const j=findPhase(jdAt(date,12)+1,180);return j==null?null:jdToDateObj(j);}
const moonEmoji=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
function getSeason(d){
  let m=d.getMonth()+1,dd=d.getDate();
  if((m==3&&dd>=20)||m==4||m==5||(m==6&&dd<21))return 0;
  if((m==6&&dd>=21)||m==7||m==8||(m==9&&dd<23))return 1;
  if((m==9&&dd>=23)||m==10||m==11||(m==12&&dd<21))return 2;
  return 3;
}
// 24 tiết khí: kinh độ mặt trời (độ). deg 0 = Xuân phân.
function sunLongDeg(jdn){
  let T=(jdn-2451545)/36525,T2=T*T,dr=PI/180;
  let M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  let L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  return (((L0+DL)%360)+360)%360;
}
// tiết khí hiện tại (index 0-23) của ngày
function currentTermIdx(jd){
  // Lấy kinh độ Mặt Trời lúc CUỐI ngày (23:59 giờ VN): nếu mốc chuyển tiết rơi
  // bất kỳ lúc nào trong ngày thì ngày đó đã thuộc tiết mới — đúng cách lịch VN ghi.
  let deg=sunLongDeg(jd+0.5-7/24-1/1440);
  return Math.floor(deg/15)%24;
}
// tìm tiết khí kế tiếp và số ngày còn lại
function nextTerm(d){
  let jd0=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  let curIdx=currentTermIdx(jd0);
  let nextIdx=(curIdx+1)%24,nextDeg=nextIdx*15;
  for(let i=1;i<=30;i++){
    let jd=jd0+i;
    let a=sunLongDeg(jd-0.5-7/24),b=sunLongDeg(jd+0.5-7/24);
    let crossed = nextDeg===0 ? (a>350&&b<10) : (a<nextDeg&&b>=nextDeg);
    if(crossed)return{idx:nextIdx,days:i};
  }
  return{idx:nextIdx,days:null};   // không dò được: báo rõ, không đoán
}

// ═══════════════ COSMIC (theo ngày xem) ═══════════════
const UAGE=13.8e9;
const cosmicEv=[[13.8e9,"bigBang"],[13.6e9,"milkyWay"],[4.6e9,"solarSys"],[3.8e9,"lifeEarth"],[6.6e7,"dino"],[3e5,"human"]];
function yearsAgoToCosmic(ya){
  let frac=(UAGE-ya)/UAGE,doy=frac*365.25;
  let d=new Date(2000,0,1);d.setDate(d.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  return{date:d,hh,mm,doy};
}
// map ngày đang xem -> vị trí trong "năm vũ trụ"
function cosmicForDate(date){
  let y0=new Date(date.getFullYear(),0,1),y1=new Date(date.getFullYear()+1,0,1);
  let frac=(date-y0)/(y1-y0);
  // cosmic date = same fraction of the cosmic year
  let doy=frac*365.25;
  let cd=new Date(2000,0,1);cd.setDate(cd.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  // years since big bang at this fraction
  let ysbb=frac*UAGE;
  return{date:cd,hh,mm,frac,ysbb};
}

function drukUpcoming(d,t){
  const base=tibetan(d).year,ref=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),list=[];
  for(let yy=base;yy<=base+1;yy++)for(const e of DUCHEN){

      if(diff>=0&&diff<=380)list.push([diff,t[e[2]],td.westernDateStr]);

}

    let l=solarToLunar(x.getDate(),x.getMonth()+1,x.getFullYear(),7);if(l.month===lm&&l.day===ld)return i;}

// Chi tiết (tab nào, ngôn ngữ nào, chọn kiểu gì) lưu làm metadata BÊN TRONG event.
const AK='lich_analytics_v1';
const EVENTS=['tab_open','date_select','language_change','first_visit','return_visit','note_add','share','convert'];
function trackSrc(){
  try{
    const q=new URLSearchParams(location.search).get('src');
    if(!q)return;
    const k='ldc_src';
    if(!localStorage.getItem(k))localStorage.setItem(k,q.slice(0,24));
  }catch(e){}
}
function track(ev,meta){
  if(!EVENTS.includes(ev))return;
  try{
    let a=JSON.parse(localStorage.getItem(AK)||'{}');
    a.events=a.events||{};a.events[ev]=(a.events[ev]||0)+1;
    if(meta){a.meta=a.meta||{};a.meta[ev]=a.meta[ev]||{};a.meta[ev][meta]=(a.meta[ev][meta]||0)+1;}
    let td=(function(){const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())})();
    a.days=a.days||[];if(!a.days.includes(td))a.days.push(td);
    a.last=td;
    localStorage.setItem(AK,JSON.stringify(a));
  }catch(e){}
}
// gọi 1 lần khi mở app: phân biệt lần đầu / quay lại
function trackVisit(){
  try{
    let a=JSON.parse(localStorage.getItem(AK)||'{}');
    let td=(function(){const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())})();
    if(!a.first){a.first=td;localStorage.setItem(AK,JSON.stringify(a));trackSrc();track('first_visit');}
    else{track('return_visit');}
  }catch(e){}
}
window.getStats=function(){try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch(e){return{}}};

// ═══════════════ LỊCH: NGÀY / TUẦN / THÁNG / NĂM ═══════════════
let MODE='month',GY=VIEW.getFullYear(),GM=VIEW.getMonth();
function syncGYM(){GY=VIEW.getFullYear();GM=VIEW.getMonth();}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
// chấm sự kiện: lễ/vía Phật giáo hoặc Düchen/Losar Tạng
function evDot(date,lun){
  if(T.vi.buddhaEv.some(e=>e[0]===lun.month&&e[1]===lun.day))return true;
  const tb=tibetan(date);
  return !tb.leap&&DUCHEN.some(e=>tb.month===e[0]&&tb.day===e[1]);
}
// một ô ngày dùng chung cho lưới Tháng và Tuần
// ═══ Ngày hoàng đạo — 12 trực thần (Thanh Long khởi theo chi tháng âm) ═══
// Hoàng đạo: Thanh Long, Minh Đường, Kim Quỹ, Bảo Quang, Ngọc Đường, Tư Mệnh
const HD_START=[8,10,0,2,4,6,8,10,0,2,4,6]; // chi tháng Tý..Hợi -> chi khởi Thanh Long
const HD_GODS_VI=["Thanh Long","Minh Đường","Thiên Hình","Chu Tước","Kim Quỹ","Bảo Quang","Bạch Hổ","Ngọc Đường","Thiên Lao","Huyền Vũ","Tư Mệnh","Câu Trận"];
const HD_GOOD=[1,1,0,0,1,1,0,1,0,0,1,0];
function dayHoangDao(d){
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const chiThang=(lun.month+1)%12; // tháng Giêng = Dần(2)... quy về chi 0-11
  const jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  const chiNgay=(jd+1)%12;
  const idx=((chiNgay-HD_START[chiThang])%12+12)%12;
  return{god:HD_GODS_VI[idx],good:HD_GOOD[idx]===1};
}
function cellHtml(c){
  const lun=solarToLunar(c.getDate(),c.getMonth()+1,c.getFullYear(),7);
  const tdy=sameDay(c,new Date()),sel=sameDay(c,VIEW);
  const bold=lun.day===1||lun.day===15;
  const ltxt=lun.day===1?lun.day+'/'+lun.month+(lun.leap?'n':''):lun.day;
  const hd=dayHoangDao(c);
  return `<div class="d ${tdy?'today':''} ${sel&&!tdy?'sel':''} ${c.getDay()===0?'sun':''}" onclick="selDay(${c.getFullYear()},${c.getMonth()},${c.getDate()})">
    ${hd.good?'<span class="hdd g"></span>':''}
    <div class="g">${c.getDate()}</div>
    <div class="l ${bold?'b':''}">${ltxt}</div>
    ${evDot(c,lun)?'<div class="ev"></div>':''}</div>`;
}
function gridMonth(t){
  const first=new Date(GY,GM,1),start=(first.getDay()+6)%7,dim=new Date(GY,GM+1,0).getDate();
  let h='<div class="mgrid">'+t.dow.map(x=>`<div class="hd">${x}</div>`).join('');
  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++)h+=cellHtml(new Date(GY,GM,d));
  return h+`</div><div class="legend">${t.legend}</div>`;
}
function gridWeek(t){
  const mon=new Date(VIEW);mon.setDate(VIEW.getDate()-((VIEW.getDay()+6)%7));
  let h='<div class="mgrid">'+t.dow.map(x=>`<div class="hd">${x}</div>`).join('');
  for(let i=0;i<7;i++){const c=new Date(mon);c.setDate(mon.getDate()+i);h+=cellHtml(c);}
  return h+`</div><div class="legend">${t.legend}</div>`;
}
function gridYear(t){
  const now=new Date();let h='<div class="ygrid">';
  for(let m=0;m<12;m++){
    const first=new Date(GY,m,1),start=(first.getDay()+6)%7,dim=new Date(GY,m+1,0).getDate();
    let cells='';for(let i=0;i<start;i++)cells+='<i></i>';
    for(let d=1;d<=dim;d++){const tdy=now.getFullYear()===GY&&now.getMonth()===m&&now.getDate()===d;
      cells+=`<i class="${tdy?'td':''}">${d}</i>`;}
    h+=`<div class="ymon" onclick="gotoMonth(${m})"><div class="yt">${LANG=='vi'?'Tháng '+(m+1):t.moShort[m]}</div><div class="yc">${cells}</div></div>`;
  }
  return h+'</div>';
}
// thanh điều hướng: mũi tên bước theo đơn vị của chế độ đang xem
function navRow(t){
  let lbl;
  if(MODE==='day')lbl=`<input type="date" id="dp" value="${VIEW.getFullYear()}-${pad(VIEW.getMonth()+1)}-${pad(VIEW.getDate())}" onchange="pickDate()">`;
  else if(MODE==='week'){const mon=new Date(VIEW);mon.setDate(VIEW.getDate()-((VIEW.getDay()+6)%7));
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    lbl=`<span class="lbl" onclick="setMode('month')">${mon.getDate()}–${sun.getDate()} ${t.moShort[sun.getMonth()]} · ${sun.getFullYear()}</span>`;}
  else if(MODE==='month')lbl=`<span class="lbl" style="white-space:nowrap" onclick="setMode('year')">${LANG=='vi'?'Tháng '+(GM+1):t.moShort[GM]} · ${GY} ▾</span>`;
  else lbl=`<span class="lbl">${GY}</span>`;
  return `<div class="mnav"><button onclick="navUnit(-1)">‹</button>${lbl}<button class="tdy" onclick="goToday()">${t.navToday}</button><button onclick="navUnit(1)">›</button></div>`;
}
function navUnit(n){
  if(MODE==='day'){VIEW=new Date(VIEW.getTime()+n*864e5);syncGYM();}
  else if(MODE==='week'){VIEW=new Date(VIEW.getTime()+n*7*864e5);syncGYM();}
  else if(MODE==='month'){GM+=n;if(GM<0){GM=11;GY--}if(GM>11){GM=0;GY++}}
  else{GY+=n;}
  track('date_select','arrow');renderScreen();
}
function setMode(m){MODE=m;DETAIL=false;if(m==='month'||m==='year')syncGYM();track('tab_open','calendar:mode-'+m);renderScreen();}
function setModeIdx(i){setMode(['day','week','month','year','convert'][i]);}
function gotoMonth(m){GM=m;MODE='month';renderScreen();}
function goToday(){VIEW=new Date();syncGYM();track('date_select','today');renderScreen();}
function selDay(y,m,d){VIEW=new Date(y,m,d,12);GY=y;GM=m;DETAIL=true;track('date_select','grid');if(MAIN!==1){MAIN=1;renderMainTabs();}renderScreen();window.scrollTo(0,0);}
// dải tuần nhỏ trên màn Hôm nay
function weekStrip(d,t){
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  let h='<div class="wk">';
  for(let i=0;i<7;i++){
    const c=new Date(mon);c.setDate(mon.getDate()+i);
    const lun=solarToLunar(c.getDate(),c.getMonth()+1,c.getFullYear(),7);
    const tdy=sameDay(c,new Date());
    h+=`<div class="c ${tdy?'today':''} ${c.getDay()===0?'sun':''} ${dayHoangDao(c).good?'hdg':''}" onclick="selDay(${c.getFullYear()},${c.getMonth()},${c.getDate()})">
      <div class="dw">${t.dow[i]}</div><div class="g">${c.getDate()}</div>
      <div class="l">${lun.day===1?lun.day+'/'+lun.month:lun.day}</div></div>`;
  }
  return h+'</div>';
}

// ═══════════════ V2: CHI TIẾT NGÀY · SỰ KIỆN · ĐỔI NGÀY · THANH CAN CHI ═══════════════
let DETAIL=false,CVMODE=0;
// gom mọi sự kiện của 1 ngày (kèm badge nguồn)
// ═══════════════ THANG THỜI GIAN (tính từ engine, không nhập tay) ═══════════════
// Rabjung: chu kỳ 60 năm, Rabjung 1 khởi 1027 CE (nguồn: THL, Rigpa Wiki, Janson)
function rabjung(gy){return{cycle:Math.floor((gy-1027)/60)+1,year:((gy-1027)%60)+1};}
function cycle60(gy){return{prev:gy-60,next:gy+60};}
// ═══════════════ GHI CHÚ GIỖ / SINH NHẬT ÂM LỊCH ═══════════════
// Lưu trên máy: [{id,name,type:'gio'|'sn'|'khac',m,d,cal:'lunar'|'solar'}]
function loadNotes(){try{return JSON.parse(localStorage.getItem('ldc_notes')||'[]')}catch(e){return[]}}
function saveNotes(n){try{localStorage.setItem('ldc_notes',JSON.stringify(n))}catch(e){}}
function addNote(name,type,m,d,cal){
  const n=loadNotes();
  n.push({id:Date.now(),name:name.trim(),type,m:+m,d:+d,cal});
  saveNotes(n);track('note_add',cal);
}
function delNote(id){saveNotes(loadNotes().filter(x=>x.id!==id));}
// ghi chú rơi vào ngày dương cụ thể? (so theo âm hoặc dương)
function notesOn(date){
  const notes=loadNotes();if(!notes.length)return[];
  const lun=solarToLunar(date.getDate(),date.getMonth()+1,date.getFullYear(),7);
  return notes.filter(x=>x.cal==='lunar'
    ?(x.m===lun.month&&x.d===lun.day&&!lun.leap)
    :(x.m===date.getMonth()+1&&x.d===date.getDate()));
}
// các ghi chú sắp tới trong `win` ngày (kèm số ngày còn lại)
function notesUpcoming(from,win){
  const out=[];
  for(let i=0;i<=win;i++){
    const c=new Date(from.getTime()+i*864e5);
    for(const n of notesOn(c))out.push({n,days:i,date:c});
  }
  return out;
}
const NOTE_TYPE_VI={gio:"Giỗ",sn:"Sinh nhật",khac:"Kỷ niệm"};
const NOTE_TYPE_EN={gio:"Memorial",sn:"Birthday",khac:"Anniversary"};
function noteTypeName(ty){return (LANG=='vi'?NOTE_TYPE_VI:NOTE_TYPE_EN)[ty]||ty;}
function dayEvents(c,t){
  const lun=solarToLunar(c.getDate(),c.getMonth()+1,c.getFullYear(),7);
  const out=[];
  for(const x of notesOn(c))out.push({n:'♥ '+noteTypeName(x.type)+' '+x.name,b:LANG=='vi'?'CỦA TÔI':'MINE',cls:'',note:1});
  const be=t.buddhaEv.find(e=>e[0]===lun.month&&e[1]===lun.day);
  if(be)out.push({n:be[2],b:t.srcPhat,cls:''});
  const cu=t.cult.find(e=>e[0]===lun.month&&e[1]===lun.day);
  if(cu)out.push({n:cu[2],b:t.srcCult,cls:''});
  if(lun.day===15)out.push({n:t.fullDay,b:t.srcLun,cls:''});
  if(lun.day===1)out.push({n:t.newDay,b:t.srcLun,cls:''});
  const tb=tibetan(c);
  if(!tb.leap)for(const e of DUCHEN)if(tb.month===e[0]&&tb.day===e[1])out.push({n:t[e[2]],b:t.srcTib,cls:'tib'});
  return out;
}
function evRow(c,ev,t){
  const lun=solarToLunar(c.getDate(),c.getMonth()+1,c.getFullYear(),7);
  return `<div class="evrow" onclick="selDay(${c.getFullYear()},${c.getMonth()},${c.getDate()})">
    <div class="ed"><div class="d1">${c.getDate()}/${c.getMonth()+1}</div><div class="d2">${lun.day}/${lun.month} ${LANG=='vi'?'âm':'lun'}</div></div>
    <div class="et"><div class="n">${ev.n}</div><div class="s"><span class="badge ${ev.cls}">${ev.b}</span></div></div>
  </div>`;
}
function monthEvents(t){
  const dim=new Date(GY,GM+1,0).getDate();let h='';
  for(let d=1;d<=dim;d++){const c=new Date(GY,GM,d);
    for(const ev of dayEvents(c,t))h+=evRow(c,ev,t);}
  return h?`<div class="evmonth">${t.monthEvTitle}</div>${h}`:'';
}
function screenEvents(){
  const t=T[LANG],now=new Date();let h='';
  for(let k=0;k<12;k++){
    const y=now.getFullYear()+Math.floor((now.getMonth()+k)/12),m=(now.getMonth()+k)%12;
    const dim=new Date(y,m+1,0).getDate();let mh='';
    for(let d=1;d<=dim;d++){const c=new Date(y,m,d);
      if(k===0&&d<now.getDate())continue;
      for(const ev of dayEvents(c,t))mh+=evRow(c,ev,t);}
    if(mh)h+=`<div class="evmonth">${LANG=='vi'?'Tháng':'Month'} ${m+1}/${y}</div>`+mh;
  }
  return `<div class="card" style="padding:16px 18px"><h2 style="font-size:16px">${t.evTitle}</h2></div>`+h;
}
// trang chi tiết 1 ngày: đủ 4 lăng kính
function detailBody(t){

  const evH=evs.length?`<div class="card"><h2>${t.dEvents}</h2>

  </div>`:'';
  return evH+panelVanNien()+panelCanChi()+panelBuddha()+panelDrukpa();

function dayDetail(t){

}

async function shareDay(){
  const d=VIEW,t=T[LANG];
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const cyD=ccDay(lun.jd),cyY=ccYear(lun.year),mp=moonPhase(d);
  const L=dailyLine(d,t);
  const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;
  const x=cv.getContext('2d');
  x.fillStyle='#FAF7F0';x.fillRect(0,0,1080,1350);
  x.strokeStyle='#EDE6D8';x.lineWidth=6;x.strokeRect(40,40,1000,1270);
  x.textAlign='center';x.fillStyle='#6E6A5E';
  x.font='600 40px Inter,sans-serif';
  x.fillText(t.weekdays[d.getDay()].toUpperCase(),540,190);
  x.fillStyle='#B03A30';x.font='800 340px Inter,sans-serif';
  x.fillText(d.getDate(),540,510);
  x.fillStyle='#6E6A5E';x.font='500 44px Inter,sans-serif';
  x.fillText('Th'+(d.getMonth()+1)+' · '+d.getFullYear(),540,590);
  x.fillStyle='#1C1B18';x.font='600 52px Inter,sans-serif';
  x.fillText((LANG=='vi'?'Mùng ':'Lunar ')+lun.day+(LANG=='vi'?' tháng ':'/')+lun.month+(lun.leap?'*':''),540,700);
  x.fillStyle='#6E6A5E';x.font='400 40px Inter,sans-serif';
  x.fillText((LANG=='vi'?'Năm ':'')+t.can[cyY[0]]+' '+t.chi[cyY[1]]+' · '+(LANG=='vi'?'ngày ':'day ')+t.can[cyD[0]]+' '+t.chi[cyD[1]],540,770);
  x.strokeStyle='#EDE6D8';x.lineWidth=2;
  x.beginPath();x.moveTo(240,850);x.lineTo(840,850);x.stroke();
  // dòng của ngày (bọc dòng)
  x.fillStyle='#1C1B18';x.font='500 42px Inter,sans-serif';
  const words=L.txt.replace(/[“”]/g,'').split(' ');let line='',ly=950;
  for(const w of words){
    if(x.measureText(line+w).width>860){x.fillText(line,540,ly);ly+=62;line=w+' ';}
    else line+=w+' ';
  }
  x.fillText(line.trim(),540,ly);
  x.fillStyle='#9A9384';x.font='400 32px Inter,sans-serif';
  x.fillText(L.lens+' · '+(d.getDate())+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),540,ly+80);
  x.fillStyle='#B03A30';x.font='700 36px Inter,sans-serif';
  x.fillText('☽ '+(LANG=='vi'?'Lịch Đa Chiều':'Multi Calendar'),540,1240);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],'lich-da-chieu.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});track('share','day_image');return;
    }
  }catch(e){if(e.name==='AbortError')return;}
  // fallback: mở ảnh tab mới để lưu tay
  const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

// ═══ ĐỔI NGÀY ═══
function lunarToSolar(d,m,y,leap){
  for(let i=0;i<490;i++){const dd=new Date(y,0,1+i);
    const l=solarToLunar(dd.getDate(),dd.getMonth()+1,dd.getFullYear(),7);
    if(l.day===d&&l.month===m&&l.year===y&&(!!l.leap)===(!!leap))return dd;}
  return null;
}
function selOpts(a,b,sel){let h='';for(let i=a;i<=b;i++)h+=`<option ${i===sel?'selected':''}>${i}</option>`;return h;}
function cvInputs(t){
  const d=VIEW,lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7),tb=tibetan(d);

function sunMoonTimes(date){

  try{

    const st=SunCalc.getTimes(d,L.la,L.lo);

// vẽ pha trăng bằng SVG — đơn giản, sạch
function moonSVG(f,wax,size){
  const R=size/2-3,cx=size/2,cy=size/2;
  const a=Math.max(0.6,R*Math.abs(1-2*f));
  const s1=wax?1:0;
  const s2=wax?(f<0.5?0:1):(f<0.5?1:0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="#2B2822"/>
    <path d="M ${cx} ${cy-R} A ${R} ${R} 0 0 ${s1} ${cx} ${cy+R} A ${a} ${R} 0 0 ${s2} ${cx} ${cy-R}" fill="#F6F1E4"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#CFC7B2" stroke-width="1.5"/>
  </svg>`;
}

// tìm nước lớn/ròng từ chuỗi giờ
function tideExtremes(j){
  const tm=j.hourly.time,h=j.hourly.sea_level_height_msl,out=[];
  const now=new Date();
  for(let i=1;i<h.length-1;i++){
    if(h[i]==null||h[i-1]==null||h[i+1]==null)continue;
    const hi=h[i]>=h[i-1]&&h[i]>=h[i+1],lo=h[i]<=h[i-1]&&h[i]<=h[i+1];
    if(!hi&&!lo)continue;
    const d=new Date(tm[i]);
    if(d<now)continue;
    if(out.length&&out[out.length-1].hi===hi)continue;
    out.push({hi,d,v:h[i]});
    if(out.length>=6)break;
  }
  return out;
}
function tideSpark(j){
  const tm=j.hourly.time,h=j.hourly.sea_level_height_msl;
  const n=Math.min(h.length,48),vals=[];
  // null = thiếu dữ liệu: giữ nguyên null, KHÔNG biến thành 0m và KHÔNG nội suy —
  // đường sẽ được ngắt tại đó để người xem thấy rõ chỗ nào không có số liệu.
  for(let i=0;i<n;i++)vals.push(h[i]==null?null:h[i]);
  if(vals.filter(v=>v!=null).length<3)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  // cắt thành các đoạn liên tục, mỗi đoạn một polyline riêng
  const segs=[];let cur=[];
  vals.forEach((v,i)=>{
    if(v==null){if(cur.length>1)segs.push(cur);cur=[];return}
    cur.push(`${(i/(n-1)*320).toFixed(1)},${(82-(v-mn)/sp*66).toFixed(1)}`);
  });
  if(cur.length>1)segs.push(cur);
  const pts=segs.map(sg=>sg.join(' '));
  const now=nowAtLoc(),i0=Math.max(0,Math.min(n-1,Math.round((now-new Date(tm[0]))/36e5)));
  const hasNow=vals[i0]!=null;
  const nx=(i0/(n-1)*320).toFixed(1),ny=hasNow?(82-(vals[i0]-mn)/sp*66).toFixed(1):0;
  return `<svg class="tidegraph" viewBox="0 0 320 90" preserveAspectRatio="none">
    ${pts.map(p=>`<polyline points="${p}" fill="none" stroke="#6F9585" stroke-width="2.5"/>`).join('')}
    ${hasNow?`<circle cx="${nx}" cy="${ny}" r="4" fill="#B03A30"/>`:''}
  </svg>`;
}
function tideRegime(t){
  const age=moonPhase(new Date()).age;
  const dSyz=Math.min(age,Math.abs(age-14.77),Math.abs(age-29.53));
  const dQtr=Math.min(Math.abs(age-7.38),Math.abs(age-22.15));
  if(dSyz<=2.5)return t.tideSpring;
  if(dQtr<=2.5)return t.tideNeap;
  return t.tideMid;
}

// Nguồn: Kalacakra.org (Edward Henning, dựa Vimalaprabhā). Đã đối chiếu khớp lịch Drukpa chính thức.
function moonLon(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let Lp=218.3164477+481267.88123421*T-0.0015786*T*T;
  let D=(297.8501921+445267.1114034*T-0.0018819*T*T)*dr;
  let M=(357.5291092+35999.0502909*T)*dr;
  let Mp=(134.9633964+477198.8675055*T+0.0087414*T*T)*dr;
  let F=(93.2720950+483202.0175233*T-0.0036539*T*T)*dr;
  let s=6288774*Math.sin(Mp)+1274027*Math.sin(2*D-Mp)+658314*Math.sin(2*D)
    +213618*Math.sin(2*Mp)-185116*Math.sin(M)-114332*Math.sin(2*F)
    +58793*Math.sin(2*D-2*Mp)+57066*Math.sin(2*D-M-Mp)+53322*Math.sin(2*D+Mp)
    +45758*Math.sin(2*D-M)-40923*Math.sin(M-Mp)-34720*Math.sin(D)
    -30383*Math.sin(M+Mp)+15327*Math.sin(2*D-2*F)-12528*Math.sin(Mp+2*F)
    +10980*Math.sin(Mp-2*F);
  return (((Lp+s/1e6)%360)+360)%360;
}

// hoa sen 8 cánh — nét mảnh
function ornLotus(size,color){
  const c=size/2;let p='';
  for(let i=0;i<8;i++){
    const a=i*45*PI/180,x=c+Math.sin(a)*c*0.72,y=c-Math.cos(a)*c*0.72;
    const x1=c+Math.sin(a-0.42)*c*0.34,y1=c-Math.cos(a-0.42)*c*0.34;
    const x2=c+Math.sin(a+0.42)*c*0.34,y2=c-Math.cos(a+0.42)*c*0.34;
    p+=`<path d="M${c} ${c} Q${x1} ${y1} ${x.toFixed(1)} ${y.toFixed(1)} Q${x2} ${y2} ${c} ${c} Z" fill="none" stroke="${color}" stroke-width="1.1"/>`;
  }
  return `<svg class="lotus" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${p}
    <circle cx="${c}" cy="${c}" r="${size*0.1}" fill="none" stroke="${color}" stroke-width="1.1"/></svg>`;
}
// bánh xe Pháp 8 nan
function ornWheel(size,color){
  const c=size/2,r=size*0.42;let p='';
  for(let i=0;i<8;i++){
    const a=i*45*PI/180;
    p+=`<line x1="${c}" y1="${c}" x2="${(c+Math.sin(a)*r).toFixed(1)}" y2="${(c-Math.cos(a)*r).toFixed(1)}" stroke="${color}" stroke-width="1"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="1.2"/>
    <circle cx="${c}" cy="${c}" r="${r*0.22}" fill="none" stroke="${color}" stroke-width="1.2"/>${p}</svg>`;
}

function nakshatra(date){
  const jd=jdAt(date,12);
  const sid=(((moonLon(jd)-24.21)%360)+360)%360; // ayanamsa ~24,21° cho thập niên 2020
  return Math.floor(sid/(360/27));
}

function elementYoga(date){
  const n=nakshatra(date),a=WD_EL[date.getDay()],b=NAK_EL[n];
  const key=YOGA[a+'+'+b]?a+'+'+b:b+'+'+a;

  if(!y)return null;
  const EL=LANG=='vi'?EL_VI:EL_EN;
  return{pair:`${EL[a]} – ${EL[b]}`,tib:y.tib,skt:y.skt,a:a,b:b,
    elA:EL[a],elB:EL[b],mean:LANG=='vi'?y.vi:y.en,good:y.good,nak:NAK_NAME[n]};
}

function glo(k){
  const g=GLOSS[k];if(!g)return;
  const [ti,tx]=g[LANG]||g.vi;
  let el=document.getElementById('glo');
  if(!el){el=document.createElement('div');el.id='glo';document.body.appendChild(el);}
  el.innerHTML=`<div class="glbox"><div class="glt">${ti}</div><div class="glx">${tx}</div>
    <button onclick="document.getElementById('glo').classList.remove('on')">${LANG=='vi'?'Đóng':'Close'}</button></div>`;
  el.classList.add('on');
  el.onclick=e=>{if(e.target.id==='glo')el.classList.remove('on')};
}
// ═══════════════ HÔM NAY CÓ GÌ ĐẶC BIỆT — điểm theo ngữ cảnh ═══════════════
// Nguyên tắc: không gán cứng. Mưa ban đêm = 0 điểm. Ngưỡng hiện ≥45, tối đa 2 mục.
function specialToday(d,t){
  const out=[];
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const tb=tibetan(d),jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());

  // ① Ghi chú cá nhân
  for(const n of notesOn(d))
    out.push({sc:88,hub:0,title:'♥ '+noteTypeName(n.type)+' '+n.name,sub:t.spNoteToday,go:'setMain(0)'});
  if(!out.length){
    const up=notesUpcoming(d,3).filter(u=>u.days>0);
    if(up.length)out.push({sc:70,hub:0,title:'♥ '+noteTypeName(up[0].n.type)+' '+up[0].n.name,
      sub:t.spNoteSoon.replace('{n}',up[0].days),go:'setMain(0)'});
  }

  // ② Thời tiết — chỉ tính khung 6h–21h
  if(WX&&WX.hourly&&WX.hourly.precipitation_probability){
    const H=WX.hourly;let best=-1,bi=-1;
    for(let i=0;i<H.time.length;i++){
      const dt=new Date(H.time[i]);
      if(!sameDay(dt,d))continue;
      const h=dt.getHours();if(h<6||h>21)continue;
      const p=H.precipitation_probability[i]??0;
      if(p>best){best=p;bi=i;}
    }
    if(best>=55&&bi>=0){
      const h=new Date(H.time[bi]).getHours();
      const sc=Math.round(30+(best-50)*1.2);
      const part=h<10?t.pMorning:(h<14?t.pNoon:(h<18?t.pAfternoon:t.pEvening));
      out.push({sc,hub:4,title:t.spRain.replace('{p}',part),
        sub:t.spRainSub.replace('{h}',pad(h)+'h').replace('{v}',best),go:'goExp(4)'});
    }
    if(WX.daily){
      const hi=Math.round(WX.daily.temperature_2m_max[0]),lo=Math.round(WX.daily.temperature_2m_min[0]);
      if(hi>=35)out.push({sc:60+(hi-35)*4,hub:4,title:t.spHot.replace('{t}',hi),sub:t.spHotSub,go:'goExp(4)'});
      else if(lo<=15)out.push({sc:55+(15-lo)*3,hub:4,title:t.spCold.replace('{t}',lo),sub:t.spColdSub,go:'goExp(4)'});
    }
  }

  // ③ Lễ lớn văn hóa + Phật giáo
  const cu=t.cult.find(e=>e[0]===lun.month&&e[1]===lun.day);
  const be=t.buddhaEv.find(e=>e[0]===lun.month&&e[1]===lun.day);
  // hai bảng có thể trùng ngày (vd Vu Lan) — chỉ lấy MỘT mục lễ
  if(cu)out.push({sc:82,hub:2,title:cu[2],sub:t.spCult,go:'goExp(2)',kind:'fest'});
  else if(be)out.push({sc:82,hub:2,title:be[2],sub:t.spBuddha,go:'goExp(2)',kind:'fest'});

  // ④ Düchen Tạng
  if(!tb.leap)for(const e of DUCHEN)if(tb.month===e[0]&&tb.day===e[1])
    out.push({sc:76,hub:3,title:t[e[2]],sub:t.spDuchen,go:'goExp(3)'});

  // ⑤ Rằm / mùng 1
  if(!out.some(x=>x.kind==='fest')){
    if(lun.day===15)out.push({sc:66,hub:1,title:t.fullDay,sub:t.spFull,go:'goExp(0)'});
    else if(lun.day===1)out.push({sc:66,hub:1,title:t.newDay,sub:t.spNew,go:'goExp(0)'});
  }

  // ⑥ Chuyển tiết khí
  const ct=currentTermIdx(jd);
  if(ct!==currentTermIdx(jd-1))
    out.push({sc:58,hub:2,title:t.terms[ct],sub:t.spTerm,go:'goExp(0)'});

  // ⑦ Ngày thực hành Tạng
  if(!tb.leap&&[8,10,15,25,30].includes(tb.day)&&!out.some(x=>x.hub===3))
    out.push({sc:48,hub:3,title:t.spTibPractice.replace('{d}',tb.day),sub:t.spTibSub,go:'goExp(3)'});

  // sắp theo điểm, nhưng 2 mục hiển thị phải khác nguồn (không dồn 2 mục cùng hub)
  const sorted=out.filter(x=>x.sc>=45).sort((a,b)=>b.sc-a.sc);
  const pick=[];
  for(const x of sorted){
    if(pick.length>=2)break;
    if(pick.some(y=>y.hub===x.hub))continue;
    pick.push(x);
  }
  // nếu chỉ có 1 nguồn mà còn chỗ, lấy thêm mục điểm cao kế tiếp
  if(pick.length<2)for(const x of sorted){
    if(pick.length>=2)break;
    if(!pick.includes(x))pick.push(x);
  }
  return pick;
}
function specialHtml(d,t){
  const sp=specialToday(d,t);
  if(!sp.length)return '';   // ngày thường: không bịa đặc biệt
  return `<div class="spbox">
    <div class="sptt">${t.spTitle}</div>
    ${sp.map(x=>`<div class="spit" onclick="${x.go}">
      <span class="spn">${x.title}</span><span class="sps">${x.sub}</span></div>`).join('')}
  </div>`;
}

function dailyLine(d,t){
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const tb=tibetan(d),mp=moonPhase(d);
  const jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  // 1) ngày thực hành Tạng
  const tl=!tb.leap&&LINES.tibet[String(tb.day)];
  if(tl)return{txt:tl[LANG],lens:t.lensTibet,src:t.srcEdited,go:()=>'goExp(3)'};
  // 2) rằm / mùng 1 → Phật giáo (câu có nguồn)
  if(lun.day===15||lun.day===1){
    const q=LINES.buddha[jd%LINES.buddha.length];
    return{txt:'“'+q[LANG]+'”',lens:t.lensBuddha,src:LANG=='vi'?q.src:q.srcEn,go:()=>'goExp(2)'};
  }
  // 3) ngày bắt đầu tiết khí → Lịch Việt
  const ct=currentTermIdx(jd),ctY=currentTermIdx(jd-1);
  if(ct!==ctY)return{txt:t.lineTerm.replace('{t}',t.terms[ct]),lens:t.lensViet,src:t.srcEdited,go:()=>'goExp(0)'};
  // 4) mặc định → thiên văn
  let k='wax';
  if(mp.illum>0.985)k='full';else if(mp.illum<0.015)k='newm';else k=mp.waxing?'wax':'wane';
  return{txt:LINES.astro[k][LANG],lens:t.lensAstro,src:t.srcEdited,go:()=>'goExp(0)'};
}

// ① thời tiết
// Giờ hiện tại TẠI ĐỊA ĐIỂM đang xem (Open-Meteo trả timezone=auto + utc_offset_seconds).
// Nếu máy ở múi giờ khác nơi xem, không được lấy giờ máy để so.
function nowAtLoc(){
  const off=(WX&&typeof WX.utc_offset_seconds==='number')?WX.utc_offset_seconds:null;
  if(off===null)return new Date();
  const utcMs=Date.now();
  const locMs=utcMs+off*1000;
  const d=new Date(locMs);
  // trả về Date mang "giờ tường" của địa điểm, đọc bằng getUTC*
  return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());
}
// Câu tóm tắt hôm nay: ngôn ngữ người, sinh từ forecast — không phán vận
function todaySentence(t){
  if(!WX||!WX.current||!WX.daily)return null;
  const c=WX.current,dl=WX.daily,H=WX.hourly;
  const hi=Math.round(dl.temperature_2m_max[0]),lo=Math.round(dl.temperature_2m_min[0]);
  const pop=dl.precipitation_probability_max[0]??0;
  // mưa vào buổi nào?
  let part=null;
  if(H&&H.precipitation_probability){
    const now=nowAtLoc();let i0=H.time.findIndex(x=>new Date(x)>=now);if(i0<0)i0=0;
    let best=-1,bi=-1;
    for(let i=i0;i<Math.min(i0+14,H.time.length);i++){
      const p=H.precipitation_probability[i]??0;
      if(p>best){best=p;bi=i;}
    }
    if(best>=55&&bi>=0){
      const h=new Date(H.time[bi]).getHours();
      part=h<10?t.pMorning:(h<14?t.pNoon:(h<18?t.pAfternoon:t.pEvening));
    }
  }
  let head,adv='';
  if(pop>=70){head=t.sRainy;adv=part?t.aRainPart.replace('{p}',part):t.aRain;}
  else if(pop>=40){head=t.sShower;adv=part?t.aRainPart.replace('{p}',part):t.aShower;}
  else if(hi>=33){head=t.sHot;adv=t.aHot;}
  else if(hi<=22){head=t.sCool;adv=t.aCool;}
  else{head=t.sClear;adv=t.aClear;}
  return{head,adv,hi,lo,set:dl.sunset[0].slice(11,16)};
}

function pickDate(){let v=document.getElementById('dp').value;if(v){VIEW=new Date(v+'T12:00:00');syncGYM();track('date_select','picker');renderScreen();}}

function setLang(l){
  LANG=l;track('language_change',l);
  document.getElementById('lvi').classList.toggle('on',l=='vi');
  document.getElementById('len').classList.toggle('on',l=='en');
  document.getElementById('brandName').textContent=T[l].brand;
  document.getElementById('footNote').textContent=T[l].foot;
  document.documentElement.lang=l;
  renderMainTabs();renderScreen();
}

// stars
(function(){let s=document.getElementById('stars'),h='';
  for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s"></i>`;
  s.innerHTML=h;})();

document.getElementById('footNote').textContent=T.vi.foot;
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
trackVisit();
if(loadLoc()){fetchWeather();fetchTide();}
renderMainTabs();renderScreen();
</script>
</body>
