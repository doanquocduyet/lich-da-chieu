<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAF7F0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch Đa Chiều">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lịch Đa Chiều · Multi-Calendar</title>
<style>
  :root{
    --paper:#171717; --gold:#222; --gold-soft:#444;
    --violet:#555; --accent:#333; --jade:#555;
    --muted:#777; --line:#e5e5e5; --line2:#eeeeee;
    --card:#fff; --card2:#fafafa}
  :root{color-scheme:light only}
  html{color-scheme:light only}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background:#f7f7f5 !important;
    color:#171717 !important;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden}
  /* lớp nền trắng vật lý — không host nào đè được */
  #bgfix{position:fixed;inset:0;background:#f7f7f5;z-index:-1;pointer-events:none}
  .hero .dm{color:#171717 !important}
  .wk .c .g{color:#171717 !important}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff !important}
  .mgrid .d .g{color:#171717 !important}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff !important}
  .mnav .lbl{color:#171717 !important}
  .stars{display:none}
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;
    padding:20px 16px 120px;min-height:100vh}
  .top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 18px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .orb{font-size:19px;color:#222;text-shadow:none}
  .brand .nm{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#444;font-weight:600}
  .lang{display:flex;gap:2px;background:#eee;border-radius:18px}
  .lang button{background:none;border:none;color:#777;border-radius:14px;font-family:inherit;letter-spacing:.04em;cursor:pointer;transition:.2s}
  .lang button.on{color:#fff;font-weight:600}
  .maintabs{grid-template-columns:repeat(3,1fr);gap:4px;
    background:#ededeb;padding:4px;border-radius:12px;margin-bottom:22px;
    position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}
  .maintabs button{background:none;border:none;color:#777;padding:11px 6px;
    border-radius:9px;font-family:inherit;font-size:13px;letter-spacing:0;cursor:pointer;
    transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .maintabs button .mi{font-size:17px;line-height:1}
  .maintabs button.on{background:#fff;color:#171717;box-shadow:0 1px 4px #00000010}
  .screen{display:none}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hero{text-align:center;padding:10px 0 6px}
  .hero .wd{letter-spacing:.18em;text-transform:uppercase;color:#777}
  .hero .dm{font-size:64px;line-height:.95;color:#111;font-weight:300;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .hero .mo{color:#777;letter-spacing:0}
  .hero .lu{display:inline-block;margin-top:16px;color:#222;border:1px solid #d9d9d9;border-radius:20px;letter-spacing:0;background:#fff}
  .hero .cy{color:#777;margin-top:10px;letter-spacing:0}
  .picker{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 20px}
  .picker button{background:#fff;border:1px solid #ddd;color:#222;border-radius:10px;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:.2s}
  .picker button:active{transform:scale(.94);background:#f3f3f3}
  .picker input{background:#fff;border:1px solid #ddd;color:#222;font-family:inherit;border-radius:10px;text-align:center;color-scheme:light}
  .picker .tdy{font-size:11px;letter-spacing:.08em;padding:0 10px;width:auto;text-transform:uppercase;color:#333}
  .subnav{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 16px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:0 0 auto;background:#fff;border:1px solid #ddd;color:#777;border-radius:20px;font-family:inherit;letter-spacing:0;cursor:pointer;transition:.2s;white-space:nowrap}
  .subnav button.on{color:#fff;font-weight:500}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px 18px;margin-bottom:12px}
  .card h2{font-weight:600;color:#222;letter-spacing:0}
  .card .en{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 16px}
  .big{color:#171717;line-height:1.05;margin:6px 0 4px;font-weight:300;font-variant-numeric:tabular-nums}
  .big small{font-size:13px;color:#888;display:block;margin-top:8px;letter-spacing:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #eee}
  .row:last-child{border-bottom:none}
  .row .k{flex-shrink:0}
  .row .v{color:#222;text-align:right}
  .row .v b{color:#222;font-weight:600}
  .row .v.jade b{color:#444}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .cell{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px 13px}
  .cell .cl{letter-spacing:.04em;text-transform:uppercase}
  .cell .cv{color:#222;margin-top:5px}
  .cell .cv b{color:#222}
  .tag{display:inline-block;font-size:11px;padding:4px 11px;border-radius:18px;letter-spacing:0;margin:2px 5px 2px 0}
  .tag.moon{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.event{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .tag.jade{color:#333;border:1px solid #ddd;background:#f7f7f7}
  .hours{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
  .hr{display:flex;align-items:center;gap:9px;border-radius:10px;background:#fafafa;border:1px solid #eee}
  .hr .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#bbb}
  .hr .hn{color:#222}
  .hr .ht{color:#888;margin-left:auto;font-variant-numeric:tabular-nums}
  .up .u{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
  .up .u:last-child{border:none}
  .up .u .un{color:#222}
  .up .u .ud{color:#555;font-variant-numeric:tabular-nums;flex-shrink:0;font-size:13px}
  .timeline{position:relative;margin:8px 0 4px;padding-left:8px}
  .tl{display:flex;gap:14px;align-items:flex-start;padding:9px 0;position:relative}
  .tl .tdot{width:10px;height:10px;border-radius:50%;background:#777;border:2px solid #fff;flex-shrink:0;margin-top:4px;box-shadow:0 0 0 1px #aaa}
  .tl.you .tdot{background:#222;box-shadow:0 0 0 1px #222}
  .tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:18px;bottom:-9px;width:1px;background:#ddd}
  .tl .tc{flex:1}
  .tl .tn{display:block;font-size:14px;color:#222}
  .tl.you .tn{color:#111;font-weight:600;letter-spacing:0}
  .tl .tt{display:block;font-size:12px;color:#888;margin-top:3px;font-variant-numeric:tabular-nums}
  .note{line-height:1.7;margin-top:16px;padding-top:15px;border-top:1px dashed #ddd;font-style:italic}
  /* — dải tuần (Hôm nay) — */
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 2px}
  .wk .c{text-align:center;cursor:pointer}
  .wk .c .dw{color:var(--muted);letter-spacing:.06em}
  .wk .c .g{margin-top:3px;color:var(--paper)}
  .wk .c .l{color:var(--muted)}
  .wk .c.today{background:var(--paper)}
  .wk .c.today .g,.wk .c.today .dw,.wk .c.today .l{color:#fff}
  /* — điều hướng tháng/năm — */
  .mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
  .mnav button{background:#fff;border:1px solid var(--line);color:var(--paper);cursor:pointer}
  .mnav .lbl{flex:1;text-align:center;font-weight:600;cursor:pointer;color:var(--paper)}
  .mnav .tdy{width:auto}
  /* — lưới tháng — */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .mgrid .hd{text-align:center;color:var(--muted);letter-spacing:.05em}
  .mgrid .d{text-align:center;cursor:pointer;background:#fff;border:1px solid var(--line2)}
  .mgrid .d .g{color:var(--paper)}
  .mgrid .d .l{color:var(--muted);line-height:1.25}
  .mgrid .d .l.b{color:var(--paper);font-weight:700}
  .mgrid .d .ev{border-radius:50%;margin:3px auto 0}
  .mgrid .d.today{background:var(--paper);border-color:var(--paper)}
  .mgrid .d.today .g,.mgrid .d.today .l,.mgrid .d.today .l.b{color:#fff}
  .mgrid .d.today .ev{background:#fff}
  .legend{color:var(--muted);text-align:center;margin:10px 0 16px}
  .mnav input{background:#fff;border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:14px;padding:8px 10px;border-radius:12px;flex:1;text-align:center;color-scheme:light}
  .ygrid{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
  .ymon{background:#fff;border:1px solid var(--line2);border-radius:12px;cursor:pointer}
  .ymon .yt{font-weight:700;margin-bottom:4px;color:var(--paper)}
  .ymon .yc{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .ymon .yc i{font-style:normal;color:var(--muted);text-align:center}
  .ymon .yc i.td{color:#fff;border-radius:50%}
  /* ═══ V2 THEME: kem + mực + đỏ trầm + ngọc ═══ */
  :root{--ink:#1C1B18;--cream:#FAF7F0;--red:#8C2F2F;--jade2:#6F9585;--bd:#EDE6D8}
  html,body{background:var(--cream) !important;color:var(--ink) !important}
  #bgfix{background:var(--cream) !important}
  .wrap{background:var(--cream);padding-bottom:100px}
  .card,.cell,.hr,.mgrid .d,.ymon{border-color:var(--bd)}
  .maintabs{display:none}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(255,253,248,.95);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
  .bnav button{background:none;border:none;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .bnav button.on{font-weight:700}
  .wk .c.today,.mgrid .d.today{background:var(--red) !important;border-color:var(--red) !important}
  .mgrid .d.sel{box-shadow:inset 0 0 0 1.5px var(--red)}
  .mgrid .d .ev{background:var(--red)}
  .mgrid .d.sun .g,.wk .c.sun .g{color:var(--red) !important}
  .mgrid .d.today .g,.wk .c.today .g{color:#fff !important}
  .mgrid .hd:last-child{color:var(--red);opacity:.8}
  .ymon .yc i.td{background:var(--red)}
  .hr.lucky{background:#6F958514;border-color:#6F958540}
  .hr.lucky .dot{background:var(--jade2)}
  .subnav button.on,.lang button.on{background:var(--ink);border-color:var(--ink)}
  .mnav .tdy{color:var(--red)}
  .ccstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--bd);
    border-radius:16px;margin:18px 0 0}
  .ccstrip .cc{text-align:center}
  .ccstrip .cl{letter-spacing:.14em}
  .ccstrip .cv{margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .ccstrip .cn{color:var(--red)}
  .backbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .backbar button{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:0 14px;cursor:pointer;color:var(--ink);font-family:inherit}
  .backbar .bt{font-weight:700;color:var(--ink)}
  .evmonth{letter-spacing:.16em;margin:20px 2px 8px;text-transform:uppercase}
  .evrow{display:flex;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;align-items:center;cursor:pointer}
  .evrow .ed{text-align:center;background:var(--red);color:#fff}
  .evrow .ed .d1{font-weight:800;line-height:1.15}
  .evrow .ed .d2{opacity:.9}
  .evrow .et{flex:1;min-width:0}
  .evrow .et .n{color:var(--ink);font-weight:600;line-height:1.3}
  .evrow .et .s{margin-top:4px}
  .badge{display:inline-block;letter-spacing:.06em;border:1px solid #E3DCCB;
    border-radius:8px;margin-right:4px;text-transform:uppercase}
  .badge.tib{border-color:#8C2F2F44}
  .cvmode{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
  .cvmode::-webkit-scrollbar{display:none}
  .cvmode button{flex:0 0 auto;background:#fff;border:1px solid var(--bd);color:#6B6559;
    border-radius:20px;font-family:inherit;cursor:pointer}
  .cvmode button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cvin{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
  .cvin .ttl{font-size:10.5px;letter-spacing:.14em;color:#8A8577;text-transform:uppercase;margin-bottom:10px}
  .cvin .row3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  .cvin select,.cvin input{width:100%;background:var(--cream);border:1px solid #E9E2D4;border-radius:10px;
    padding:11px 10px;font-family:inherit;font-size:14px;color:var(--ink);color-scheme:light}
  .cvin label.ck{display:flex;align-items:center;gap:7px;color:#6B6559;margin-top:10px}
  .cvbtn{width:100%;background:var(--red);color:#fff;border:none;border-radius:14px;
    font-family:inherit;font-weight:700;cursor:pointer;margin:2px 0 14px}
  /* ═══ V2.1 COMFORT: chạm ≥44px,số to như app lịch phổ biến,chữ dễ đọc ═══ */
  :root{--red:#B03A30;--muted:#6E6A5E}
  body{font-size:16px}
  .lang{padding:4px}
  .lang button{padding:12px 16px;font-size:13px}
  .bnav{padding:9px 4px calc(10px + env(safe-area-inset-bottom))}
  .bnav button{color:#6E6A5E}
  .bnav button.on{color:var(--red)}
  .subnav button,.cvmode button{padding:12px 18px;font-size:14.5px;min-height:44px}
  .mnav button{width:44px;height:44px;font-size:19px;border-radius:14px}
  .mnav .tdy{height:44px;padding:0 16px;font-size:13.5px}
  .mnav .lbl{font-size:17.5px}
  .wk{gap:5px}
  .wk .c{padding:9px 0 8px;border-radius:13px}
  .wk .c .dw{font-size:11px}
  .wk .c .l{margin-top:2px}
  .mgrid{gap:4px}
  .mgrid .hd{font-size:12px;padding:6px 0}
  .mgrid .d{border-radius:12px}
  .mgrid .d .ev{width:5px;height:5px;margin-top:4px}
  .legend{font-size:12.5px}
  .ygrid{gap:9px}
  .ymon{padding:10px 7px}
  .ymon .yt{font-size:13px}
  .ymon .yc i{font-size:9.5px;line-height:1.7}
  .ccstrip{padding:15px 6px}
  .ccstrip .cl{color:#6E6A5E}
  .ccstrip .cn{font-size:13px;margin-top:3px}
  .card h2{font-size:20px}
  .row{padding:13px 0}
  .row .k{font-size:14px;color:#6E6A5E}
  .row .v{font-size:16px}
  .big{font-size:46px}
  .hero .lu{font-size:16px;padding:9px 20px}
  .hero .cy{font-size:14px}
  .evmonth{font-size:12.5px;color:#6E6A5E}
  .evrow{padding:13px 14px}
  .evrow .ed{min-width:58px;padding:8px 5px;border-radius:11px}
  .evrow .ed .d1{font-size:16px}
  .evrow .ed .d2{font-size:10.5px}
  .evrow .et .n{font-size:15.5px}
  .badge{font-size:10px;padding:3px 8px;color:#6E6A5E}
  .badge.tib{color:var(--red)}
  .cvin select,.cvin input{padding:13px 12px;font-size:16px}
  .cvin label.ck{font-size:14px}
  .cvbtn{padding:16px;font-size:16px}
  .backbar button{height:44px;font-size:14px}
  .backbar .bt{font-size:16px}
  .note{font-size:13px;color:#6E6A5E}
  .hours{gap:9px}
  .hr{padding:13px 14px}
  .hr .hn{font-size:15px}
  .hr .ht{font-size:13px}
  .cell .cl{font-size:11.5px;color:#6E6A5E}
  .cell .cv{font-size:18px}
  .picker button{width:44px;height:44px}
  .picker input{padding:11px 14px;font-size:15px}
  .card .en{color:#6E6A5E}
  /* ═══ V2.2: B2 + hero nổi bật + thời tiết/triều ═══ */
  .hero .dm{font-size:122px;font-weight:800;color:var(--red) !important;letter-spacing:-.045em;line-height:.92}
  .hero .wd{font-size:15px;font-weight:700}
  .hero .mo{font-size:17px;margin-top:2px}
  .mgrid .d{min-height:80px;padding:9px 0 6px}
  .mgrid .d .g{font-size:29px;letter-spacing:-.03em;line-height:1}
  .mgrid .d .l{font-size:13px;font-weight:700;margin-top:3px}
  .mgrid .d.today{box-shadow:0 5px 16px -5px rgba(176,58,48,.55)}
  .wk .c .g{font-size:20px;font-weight:800}
  .wk .c .l{font-size:12px;font-weight:600}
  .bnav button{font-size:12.5px;gap:5px;padding:6px 0 2px}
  .bnav button .bi{font-size:0;line-height:0;display:block}
  .bnav button .bi svg{display:block;width:25px;height:25px}
  .bnav button.on .bi svg{stroke-width:2}
  .locbtn svg,.wxbtn svg{vertical-align:-3px;margin-right:2px}
  .tidegraph{width:100%;height:92px;margin:8px 0 6px}
  .locbtn{width:100%;background:#fff;border:1.5px dashed #D6CDB6;border-radius:14px;padding:15px;
    font-family:inherit;font-size:14.5px;color:#6B6559;cursor:pointer;margin:4px 0 6px}
  /* ═══ 5 HUB — 5 thế giới ═══ */
  .hubs{margin-top:20px}
  .hubttl{font-size:12px;letter-spacing:.2em;color:#8A8577;text-transform:uppercase;text-align:center;margin-bottom:14px}
  .hub{border-radius:22px;margin-bottom:12px;cursor:pointer;overflow:hidden;position:relative}
  .hub .go2{font-size:12.5px;letter-spacing:.04em;opacity:.85;margin-top:12px;display:block}
  /* ① thời tiết — bầu khí quyển */
  .hub.wx{background:linear-gradient(170deg,#EAF1F4 0%,#F6F2E9 100%);border:1px solid #DDE6E9;padding:20px}
  .hub.wx .lbl{font-size:11.5px;letter-spacing:.2em;color:#5E7480;text-transform:uppercase}
  .hub.wx .tmp{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.035em;color:#26414C;margin:6px 0 2px}
  .hub.wx .cond{font-size:17px;color:#3C5560}
  .hub.wx .place{font-size:13.5px;color:#5E7480;margin-top:10px}
  .tsent{font-size:15px;line-height:1.6;color:#26414C;margin-top:10px;padding:11px 13px;
    background:#ffffff8c;border-radius:12px;border:1px solid #D8E4E9}
  .tsent b{font-weight:750}
  .tline{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:14px;color:#26414C;flex-wrap:wrap}
  .tline .tlh b{font-weight:700;color:#5E7480;font-size:12.5px;margin-right:2px}
  .tline .tla{color:#A9BEC7;font-size:12px}
  .hub.wx .horizon{height:1px;background:#C9D8DE;margin:14px 0 12px}
  .hub.wx .sun{display:flex;justify-content:space-between;font-size:13.5px;color:#3C5560}
  .hub.wx .sun b{display:block;font-size:16px;color:#26414C;font-weight:700}
  .hub.wx .go2{color:#5E7480}
  /* ② mặt trăng — thiên thể,nền đêm */
  .hub.mn{background:linear-gradient(165deg,#1A1D2B 0%,#0E1119 100%);padding:24px 20px;text-align:center;border:1px solid #262A3A}
  .hub.mn .lbl{font-size:11.5px;letter-spacing:.2em;color:#8891AC;text-transform:uppercase}
  .hub.mn .nm{font-size:22px;color:#F2EEE2;margin-top:12px;font-weight:600}
  .hub.mn .pc{font-size:38px;font-weight:800;color:#F2EEE2;margin-top:6px;letter-spacing:-.02em}
  .hub.mn .sub{font-size:13.5px;color:#8891AC;margin-top:6px}
  .hub.mn .go2{color:#8891AC}
  /* ③ tiết khí — hình học mặt trời */

  /* ═══ FONT SỐ — bo tròn,thân thiện ═══ */
  :root{--fnum:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Inter,sans-serif}
  .hero .dm,.hero .mo,.ccstrip .cv,.mgrid .d .g,.mgrid .d .l,.wk .c .g,.wk .c .l,.big,.hub.wx .tmp,.hub.mn .pc,.hub.bd .era,.hub.tb .dnum,.pcard .pt,.pcard .phl,.ymon .yc i,.evrow .ed .d1,.cd-d,.rmd,.whero .wh,.wday .dn,.wday .dlo,.wday .dhi,.wday .dp,.whrs .hc .hu,.whrs .hc .hd,.wtile .tr,.wgc .tr,.cosbig,.v2,.evl,.mnav .lbl,.d2,.dw,.hd,.ud,.zdate,.tt,.pcard .ps,.row .v,.tsrc,.qsrc,.lu,.lun,.yr,.tm-l,.tm-r,.evmonth,.s2{font-family:var(--fnum)}
  /* ═══ THỨ BẬC MÀN HÔM NAY ═══
     Anh Duyet: "so chinh mong va nho qua","khong biet cai nao chinh cai nao phu","gio/ngay/thang/nam phai la chinh thu nhi".
     Lan truoc ha net 800 -> 750 la SAI: SF Pro Rounded o 750 mong hon Inter 800
     nhieu,nen so chinh bi tut hang. Nay keo nguoc len va tach ba bac cho ro.

     BAC 1 — so ngay: to nhat,dam nhat,do.
     BAC 2 — thanh Gio/Ngay/Thang/Nam.
     BAC 3 — moi thu con lai: vien thuoc am lich,dai tuan,nhan. */
  .hero .dm{font-size:136px;font-weight:830;letter-spacing:-.05em;line-height:.9}
  .ccstrip .cv{font-size:28px;font-weight:800;letter-spacing:-.02em}
  .ccstrip .cl{font-size:11px}
  /* dai tuan la thanh DIEU HUONG,khong phai tieu de — ha xuong bac 3 de khoi
     tranh cho voi thanh Can Chi ngay ben tren */
  .wk .c .g{font-size:19px;font-weight:650}
  /* vien thuoc am lich: cai HOP trang co vien hut mat manh hon chu ben trong no.
     Lam nhat vien va bo net dam de no lui ve bac 3 */
  .hero .lu{font-size:15.5px;font-weight:400;background:#FFFDF8;border-color:#EDE6D8}
  .mgrid .d .g{font-weight:800}

  /* ═══════════════════════════════════════════════════════════════════════
     MÀN THỜI TIẾT — BẦU TRỜI
     Nền đổi theo trời thật và theo ngày/đêm (lớp .sky-* do JS gắn vào body),nội dung nổi trên đó bằng thẻ kính mờ. KHÔNG dùng backdrop-filter:
     trên iPhone,hơn mười thẻ mờ nền cùng lúc là bắt đầu giật khi cuộn —
     mà đặt trên nền chuyển màu mượt thì nhìn không khác gì.
     ═══════════════════════════════════════════════════════════════════════ */
  body.sk-wx,body.sk-wx .wrap{background:linear-gradient(178deg,#5B7C93 0%,#7C9AAD 46%,#A9C0CE 100%) !important}
  body.sk-wx.sky-clear,body.sk-wx.sky-clear .wrap{background:linear-gradient(178deg,#2C74AE 0%,#5FA3CF 48%,#9CCBE4 100%) !important}
  body.sk-wx.sky-rain,body.sk-wx.sky-rain .wrap{background:linear-gradient(178deg,#47596A 0%,#65798A 48%,#8E9FAD 100%) !important}
  body.sk-wx.sky-storm,body.sk-wx.sky-storm .wrap{background:linear-gradient(178deg,#2F3B47 0%,#495764 48%,#6B7A88 100%) !important}
  body.sk-wx.sky-snow,body.sk-wx.sky-snow .wrap{background:linear-gradient(178deg,#6D7F8E 0%,#9BADBA 48%,#CBD7DE 100%) !important}
  body.sk-wx.sky-night,body.sk-wx.sky-night .wrap{background:linear-gradient(178deg,#0E1B2C 0%,#1D3149 52%,#2E4A64 100%) !important}
  body.sk-wx .backbar button{background:#ffffff1f;border-color:#ffffff33;color:#fff}
  body.sk-wx .backbar .bt,body.sk-wx .hubttl{color:#ffffffcc !important}
  body.sk-wx footer,body.sk-wx footer *{color:#ffffffb5 !important}
  body.sk-wx footer a{color:#fff !important}
  body.sk-wx #ldcBuild{color:#ffffffa8}
  body.sk-wx .bnav{background:#16283699;border-top-color:#ffffff26;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  body.sk-wx .bnav button{color:#ffffff8c}
  body.sk-wx .bnav button.on{color:#fff}
  body.sk-wx .brand .orb,body.sk-wx .brand .nm{color:#ffffffdb}
  body.sk-wx .lang{background:#ffffff26}
  body.sk-wx .lang button{color:#ffffffa3}
  body.sk-wx .lang button.on{background:#ffffffed;color:#20323F}

  /* ── Đầu màn: tên nơi,số to,trời,cao–thấp ────────────────────────── */
  .whero{text-align:center;color:#fff;padding:10px 0 22px;text-shadow:0 1px 12px #00000026}
  .whero .wn{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#ffffffd9;font-weight:500}
  .whero .wt{font-size:96px;font-weight:200;line-height:1;letter-spacing:-.045em;margin:2px 0 0;
    font-family:var(--fnum);font-variant-numeric:tabular-nums}
  .whero .wc{font-size:19px;color:#ffffffe0;margin-top:2px}
  .whero .wh{font-size:17px;color:#ffffffc2;margin-top:5px;font-variant-numeric:tabular-nums}

  /* ── Thẻ kính ───────────────────────────────────────────────────────── */
  .wgc{background:#ffffff1f;border:1px solid #ffffff2e;border-radius:20px;padding:14px 16px;
    margin-bottom:12px;color:#fff;overflow:hidden}

    text-transform:uppercase;color:#ffffffbd;margin-bottom:11px}

  /* ── Dải theo giờ ───────────────────────────────────────────────────── */
  .whrs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
    scroll-snap-type:x proximity;overscroll-behavior-x:contain;
    margin:0 -16px;padding:2px 16px 0}
  .whrs::-webkit-scrollbar{display:none}
  .whrs .hc{flex:0 0 auto;width:60px;text-align:center;scroll-snap-align:start}
  .whrs .hc .hu{font-size:13.5px;color:#ffffffc4;font-weight:500}
  .whrs .hc .hi{margin:9px 0 7px;color:#fff;height:24px}
  .whrs .hc .hd{font-size:11px;color:#C6E8FB;font-weight:500;min-height:15px;font-variant-numeric:tabular-nums}
  .whrs .hc .hv{font-size:18px;font-weight:500;font-family:var(--fnum);font-variant-numeric:tabular-nums}
  .whrs .hc{padding:7px 0 6px;border-radius:15px}

  /* Cot lam day mot KHUNG co san: co khung thi 20% va 90% moi so duoc voi
     nhau bang mat. Khong khung thi 20% chi la mot cham nho,khong doc ra gi. */
  .whrs .hb{width:8px;height:27px;margin:7px auto 5px;border-radius:4px;
    background:#ffffff2b;position:relative;overflow:hidden}
  .whrs .hb i{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(180deg,#BCE6FF,#3F97D6)}
  .whrs .hsep{flex:0 0 auto;width:46px;display:flex;align-items:center;justify-content:center}
  .whrs .hsep span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#ffffffd6;
    background:#ffffff29;border:1px solid #ffffff2b;border-radius:10px;padding:5px 9px;white-space:nowrap}

  /* ── Nhiều ngày: thanh nhiệt độ ─────────────────────────────────────── */
  .wday{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #ffffff1f}
  .wday:first-of-type{border-top:none}
  .wday .dn{width:62px;font-size:15.5px;font-weight:500;color:#fff;white-space:nowrap}

  .wbar b{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 1.5px #ffffff5c;margin-left:-4px}

  /* ── Lưới ô chi tiết ────────────────────────────────────────────────── */
  .wtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

  /* ═══ MƯỢT TAY ═══
     Bấm đổi tab khoá luồng chính ~117ms (đo ở CPU chậm 4×) vì cả màn bị dựng
     lại rồi trình duyệt phải tính bố cục cho TOÀN BỘ,kể cả phần dưới màn.
     content-visibility cho phép bỏ qua phần chưa nhìn thấy; contain-intrinsic-size
     giữ chiều cao ước lượng để thanh cuộn không nhảy. */
  /* ═══ BO TRÒN HẾT — MỘT LUẬT CHO CẢ APP ═══
     Chú Duyệt: "các icon này nên hạn chế có góc nhọn và hình khối tam giác,nhìn khó chịu,hãy nghiên cứu và bo tròn hết". Va tung hinh thi lan sau
     lai sot. Luat CSS de len ca thuoc tinh viet thang trong the SVG,nen chi
     mot dong nay la moi net trong app — ke ca hoa van nen va ban build sau —
     deu co dau tron va goc noi tron. */
  svg,svg *{stroke-linecap:round;stroke-linejoin:round}
  /* Icon nam LAN TRONG DONG CHU thi phai tut xuong duong chan chu,khong thi
     no lo lung tren dau chu. */
  .go2 svg,.tla svg,.sharebtn svg,.bkbtn svg,.backtoday svg,.locbtn svg,.backbar button svg,.mnav .lbl svg{vertical-align:-.22em}
  .mnav .tdy{white-space:nowrap}
  /* Dong co gia tri DAI (ten cung + ten tiet khi + ngay) thi xep nhan tren,gia tri duoi. De hai cot thi chu bi ep gay tung tu mot. */
  /* Dong bao co ban moi — nam tren thanh menu duoi,khong che noi dung */
  #newver{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));
    z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#1C1B18;color:#F6F1E4;border-radius:16px;padding:12px 14px;font-size:14px;
    box-shadow:0 6px 24px #0000002e;animation:fade .25s ease}
  #newver button{background:#F6F1E4;color:#1C1B18;border:none;border-radius:11px;
    padding:9px 15px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  /* ═══════════════════════════════════════════════════════════════════════
     PHẬT & TẠNG — hai màn của người dùng chính
     Nguyên tắc: trả lời câu hỏi hằng ngày TRƯỚC, tra cứu để SAU.
     Phật tử Việt hỏi "hôm nay có phải ngày chay không".
     Người tu Tạng hỏi "hôm nay là ngày thực hành gì, kỳ tới bao giờ".
     ═══════════════════════════════════════════════════════════════════════ */
  .chay{border-radius:16px;padding:15px 17px;margin-top:14px;
    background:#F3EFE3;border:1px solid #E4DAC2}
  .chay .ct{font-size:19px;font-weight:700;color:#6E6552;line-height:1.3}
  .chay .cs{font-size:13.5px;color:#8A8069;margin-top:6px;font-family:var(--fnum)}
  .chay.on{background:linear-gradient(160deg,#F0E4C4,#E9D9AE);border-color:#D8BE85}
  .chay.on .ct{color:#7A5A12}
  .chay.on .cs{color:#9A7B33}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .chips button{background:#fff;border:1px solid var(--bd);border-radius:20px;
    padding:9px 15px;font-family:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
  .chips button.on{background:#8C6D1F;border-color:#8C6D1F;color:#FFF8E6;font-weight:600}
  .clbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 9px}
  .cdays{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .cdays span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:9px;font-size:12.5px;font-family:var(--fnum);color:#A79C86;
    background:#F6F2E7;border:1px solid transparent}
  .cdays span.on{background:#E9D9AE;color:#6B4E0F;font-weight:700}
  .cdays span.now{border-color:#8C6D1F;box-shadow:0 0 0 1px #8C6D1F}
  .up .u .un{display:flex;flex-direction:column;gap:3px}
  .up .u .un em{font-style:normal;font-size:11.5px;color:var(--muted);font-family:var(--fnum)}
  .bud2 .bebig{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;
    color:#8C6D1F;font-family:var(--fnum);margin-top:6px}
  /* Tạng */
  .idc.tib.duchen .hd2{background:linear-gradient(168deg,#8E2C21,#6A1C15)}
  .merit{background:#D4A0171f;border:1px solid #D4A01745;border-radius:14px;
    padding:13px 15px;font-size:14px;line-height:1.6;color:#F0DFB6;margin-bottom:12px}
  .nextp{display:flex;align-items:center;gap:8px;padding:11px 0 2px;
    border-top:1px solid #ffffff20;font-size:14.5px}
  .nextp .k{font-family:var(--fnum)}
  /* Dai hom qua · hom nay · ngay mai — toa do trong thang Tang */
  .tstrip{display:grid;grid-template-columns:1.7fr 1fr;gap:8px;margin:0 0 14px}
  .tstrip .tcell:not(.on){opacity:.75}
  .tstrip .tcell:not(.on) .tcn{font-size:19px;font-weight:600}
  .tcell{background:#ffffff12;border:1px solid #ffffff1f;border-radius:14px;
    padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:inherit;font-family:inherit;cursor:pointer}
  .tcell.on{background:#ffffff24;border-color:#ffffff3d}
  .tcell .tcl{font-size:11px;opacity:.7;letter-spacing:.04em}
  .tcell .tcn{font-size:23px;font-weight:700;font-family:var(--fnum);line-height:1.05}
  .tcell.on .tcn{color:#F5C24E}
  .tcell .tcd{height:7px;display:flex;align-items:center}
  .tcell .tcd i{width:5px;height:5px;border-radius:50%;background:#D4A017;display:block}
  /* Moc thoi gian cham duoc: phai co mui ten cho biet no dan di dau */
  .nextp{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:12px 0 4px;border-top:1px solid #ffffff20;font-size:14.5px;
    background:none;border-left:none;border-right:none;border-bottom:none;
    color:inherit;font-family:inherit;text-align:left;cursor:pointer}
  .up .u{width:100%;background:none;border:none;border-bottom:1px solid #eee;
    font-family:inherit;text-align:left;cursor:pointer;color:inherit;gap:10px}
  .up .u svg{flex:0 0 auto;opacity:.4}
  .chay{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    text-align:left;font-family:inherit;cursor:pointer}
  .chay .cw{display:flex;flex-direction:column;min-width:0}
  .chay svg{flex:0 0 auto;opacity:.5}
  .lookup{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;
    margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);
    background:#fff;color:var(--ink);font-family:inherit;font-size:14.5px;cursor:pointer}
  body.sk-tib .lookup{background:#ffffff12;border-color:#ffffff26;color:#F3EDE0}
  .more .mbody{padding:0 16px 16px}
  .elblk{margin-top:16px;padding-top:14px;border-top:1px solid #ffffff20}
  .k2b{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;margin-bottom:12px}
  body.sk-tib .more{background:#ffffff0d;border-color:#ffffff20}
  body.sk-tib .more summary{color:#E8C98B}
  /* Nut vao trang chi tiet ngay tu trang chu */
  /* Vien thuoc nho, noi ro trong o dau tien — hoc theo lich pho thong */
  .daydetail{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;
    padding:10px 18px;border-radius:20px;border:1px solid #E9D5C8;
    background:#FBF3EC;color:var(--red);font-family:inherit;font-size:14px;
    font-weight:600;cursor:pointer}
  .daydetail svg{opacity:.6}
  /* Gio Ly Thuan Phong: ten (mau theo tot/xau) — nghia — cap gio */
  .ltp{padding:11px 0;border-bottom:1px solid var(--line2)}
  .ltp:last-of-type{border-bottom:none}
  .ltp .ln{font-weight:700;font-size:15px}
  .ltp .lm{font-size:13px;color:var(--muted);margin-left:8px}
  .ltp .lh{display:block;font-size:13.5px;color:var(--ink);margin-top:4px;font-family:var(--fnum)}
  .cy.alm{opacity:.75;font-size:13px;margin-top:4px}
  /* ═══ TRANG CHI TIẾT NGÀY — bat chuoc bo khung lich van nien pho thong ═══ */
  body.sk-alm,body.sk-alm .wrap{background:linear-gradient(178deg,#E3F2ED 0%,#EDF6F2 100%) !important}
  body.sk-alm .bnav{background:#F2FAF7;border-top-color:#D8E6E0}
  body.sk-alm .bnav button.on{color:#1D6FB8}
  .almv .sect{background:#fff;border:1px solid #DCE8E3;border-radius:16px;
    padding:16px 17px;margin-bottom:12px}
  .almv .sh{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .almv .sh .ic{width:33px;height:33px;border-radius:50%;background:#EDF3F0;
    display:flex;align-items:center;justify-content:center;color:#7C8A92;flex:0 0 auto}
  .almv .sh h3{font-size:15px;letter-spacing:.1em;color:#1D6FB8;text-transform:uppercase;
    font-weight:700;margin:0}
  .almv .good,.almv b.good,.almv .v b.good{color:#1E7A34}
  .almv .bad,.almv b.bad,.almv .v b.bad{color:#C03A2B}
  .almv .lbl-b{color:#1D6FB8;font-weight:700}
  .almv .sect.tt{border-left:4px solid #1E7A34;padding-left:14px}
  .almv .sect.tt.b{border-left-color:#C03A2B}
  .almv .ttl1{font-size:15px;line-height:1.6}
  .almv .ttl2{font-size:12px;color:#8A97A0;margin-top:5px}
  .almv .nowh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px;
    background:#F3F8F5;border:1px solid #E0EBE5;border-radius:12px;padding:9px 13px;margin-bottom:12px}
  .almv .nowh span{color:#5C6A72;font-family:var(--fnum)}
  .almv .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .almv .g3 em{display:block;font-style:normal;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:#8A97A0;margin-bottom:5px}
  .almv .g3 b{font-size:17.5px;color:#1D6FB8;font-weight:700}
  .almv .g3.hts{margin-top:13px;padding-top:13px;border-top:1px solid #E8F0EC;
    font-size:13.5px;color:#5C6A72}
  .almv .g3.hts b{font-size:14.5px;color:#232A30;font-weight:700}
  .almv .rows{margin-top:10px}
  .almv .ghdg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .almv .ghd{display:flex;align-items:center;gap:10px;background:#F7FAF8;
    border:1px solid #E4EDE8;border-radius:13px;padding:9px 11px}
  .almv .zc{width:42px;height:42px;border-radius:50%;background:#E5EFF8;color:#1D6FB8;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:0 0 auto}
  .almv .zt{display:flex;flex-direction:column;min-width:0}
  .almv .zt b{font-size:15px;color:#232A30}
  .almv .zt em{font-style:normal;font-size:12px;color:#8A97A0;font-family:var(--fnum)}
  .almv .ltp{padding:9px 0;border-bottom:1px solid #EEF3F0;font-size:14px}
  .almv .ltp:last-of-type{border-bottom:none}
  .almv .ltp .ln{font-weight:700;margin-right:7px}
  .almv .ltp .lh{color:#232A30;font-family:var(--fnum)}
  .almv .ltp .lm{display:block;font-size:12.5px;color:#8A97A0;margin-top:2px}
  .almv .s28{font-size:15.5px;line-height:1.55}
  .almv .s28sub{font-size:13px;color:#8A97A0;margin-top:4px}
  .almv .xrow{display:flex;gap:10px}
  .almv .xbox{border:1.5px solid #D5E2EC;border-radius:13px;padding:11px 20px;text-align:center;min-width:86px}
  .almv .xbox b{display:block;font-size:18px;color:#1D6FB8}
  .almv .xbox em{font-style:normal;font-size:12px;color:#8A97A0}
  .almv .note{border-color:#E4EDE8}
  .almv .row{border-bottom-color:#EEF3F0}
  .zrow{display:block !important;padding:11px 0}
  .zrow .k{display:block;margin-bottom:5px;text-align:left}
  .zrow .v{display:block;text-align:left;max-width:none}
  .card,.wgc,.wtile,.pcard,.exp{content-visibility:auto;contain-intrinsic-size:auto 180px}
  button,.exp,.pcard,.hub,.bnav button{touch-action:manipulation}
  .screen{animation:fade .16s ease-out}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}
</style>
</head>

// ═══════════════ LUNAR (Hồ Ngọc Đức) ═══════════════
const PI=Math.PI;
function jdFromDate(dd,mm,yy){
  let a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;
  let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;
  return jd;
}
function newMoon(k){
  let T=k/1236.85,T2=T*T,T3=T2*T,dr=PI/180;
  let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  let M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  let Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  let F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C+=-0.4068*Math.sin(Mp*dr)+0.0161*Math.sin(dr*2*Mp)-0.0004*Math.sin(dr*3*Mp);
  C+=0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mp))-0.0074*Math.sin(dr*(M-Mp));
  C+=0.0004*Math.sin(dr*(2*F+M))-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mp));
  C+=0.0010*Math.sin(dr*(2*F-Mp))+0.0005*Math.sin(dr*(2*Mp+M));
  let dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
  return J+C-dt;
}
// CHEP HAI LAN LA CO Y, DUNG "DON GON" LAI:
// sunLong() (radian, cho thuat toan am lich Ho Ngoc Duc) va sunLongDeg() (do,
// cho 24 tiet khi + hoang dao) dung chung cong thuc Meeus. Toi da thu gop:
// tinh lai sunLong tu sunLongDeg cho ket qua GIONG HET tren ca 73.414 ngay
// 1900-2100 — nhung sai so con 1,26e-13 radian, KHONG phai 0. getSunLong() lam
// tron ket qua nay xuong boi so cua 30°, va con so do quyet dinh RANH GIOI
// THANG AM va vi tri THANG NHUAN. Doi 5 dong lay mot sai so khac 0 trong doan
// code quan trong nhat cua app la doi loi. §8: khong dong vao thuat toan lich
// minh khong nam.
function sunLong(jdn){
  let T=(jdn-2451545)/36525,T2=T*T,dr=PI/180;
  let M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  let L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  let L=(L0+DL)*dr;return L-PI*2*Math.floor(L/(PI*2));
}
function getSunLong(d,tz){return Math.floor(sunLong(d-0.5-tz/24)/PI*6);}
function getNMDay(k,tz){return Math.floor(newMoon(k)+0.5+tz/24);}
function getLM11(yy,tz){
  let off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853),nm=getNMDay(k,tz);
  if(getSunLong(nm,tz)>=9)nm=getNMDay(k-1,tz);
  return nm;
}
function getLeapOff(a11,tz){
  let k=Math.floor((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1,arc=getSunLong(getNMDay(k+i,tz),tz);
  do{last=arc;i++;arc=getSunLong(getNMDay(k+i,tz),tz);}while(arc!=last&&i<14);
  return i-1;
}
function solarToLunar(dd,mm,yy,tz){
  tz=tz||7;
  let dn=jdFromDate(dd,mm,yy),k=Math.floor((dn-2415021.076998695)/29.530588853);
  let ms=getNMDay(k+1,tz);if(ms>dn)ms=getNMDay(k,tz);
  let a11=getLM11(yy,tz),b11=a11,ly;
  if(a11>=ms){ly=yy;a11=getLM11(yy-1,tz);}else{ly=yy+1;b11=getLM11(yy+1,tz);}
  let ld=dn-ms+1,diff=Math.floor((ms-a11)/29),leap=0,lm=diff+11;
  if(b11-a11>365){let lo=getLeapOff(a11,tz);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1;}}
  if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;
  return{day:ld,month:lm,year:ly,leap:leap,jd:dn};
}

// ═══════════════ ASTRO (theo ngày xem) ═══════════════
// Pha trăng theo Meeus (ch.46–48) — đối chiếu khớp ephem đến 0,1%
function moonAt(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let D=297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868;
  let M=357.5291092+35999.0502909*T-0.0001536*T*T;
  let Mp=134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699;
  const Dr=D*dr,Mr=M*dr,Mpr=Mp*dr;
  let i=180-D-6.289*Math.sin(Mpr)+2.100*Math.sin(Mr)
    -1.274*Math.sin(2*Dr-Mpr)-0.658*Math.sin(2*Dr)
    -0.214*Math.sin(2*Mpr)-0.110*Math.sin(Dr);
  i=((i%360)+360)%360;
  const illum=(1+Math.cos(i*dr))/2;
  // pha tăng khi kinh độ lệch (D) trong 0..180
  const Dn=((D%360)+360)%360;
  const waxing=Dn<180;
  let idx;
  if(illum<0.02)idx=0;else if(illum>0.98)idx=4;
  else if(waxing)idx=illum<0.46?1:(illum<0.54?2:3);
  else idx=illum>0.54?5:(illum>0.46?6:7);
  return{illum,idx,waxing,angle:i};
}
// jd tại thời điểm cụ thể (giờ ICT)
function jdAt(date,hourICT){
  return jdFromDate(date.getDate(),date.getMonth()+1,date.getFullYear())-0.5+(hourICT-7)/24;
}
// sóc/vọng thật quanh 1 ngày (dò theo góc pha)
function findPhase(fromJd,target){ // target: 0 = sóc (không trăng), 180 = vọng (trăng tròn)
  const f=jd=>{const a=moonAt(jd).angle;
    if(target===180)return a-180;
    return a>180?a-360:a;};
  let prev=f(fromJd),jd=fromJd;
  for(let i=1;i<=40;i++){
    const cur=f(fromJd+i);
    if(prev<0&&cur>=0||prev<=0&&cur>0){ // đổi dấu -> khoảng chứa nghiệm
      let lo=fromJd+i-1,hi=fromJd+i;
      for(let k=0;k<40;k++){const mid=(lo+hi)/2;(f(mid)<0)?lo=mid:hi=mid;}
      return (lo+hi)/2;
    }
    prev=cur;
  }
  return null;   // không tìm được nghiệm: báo rõ, không trả số xấp xỉ
}
function jdToDateObj(jd){
  const z=Math.floor(jd+0.5),f=jd+0.5-z;
  let a=z;
  if(z>=2299161){const al=Math.floor((z-1867216.25)/36524.25);a=z+1+al-Math.floor(al/4);}
  const b=a+1524,c=Math.floor((b-122.1)/365.25),d2=Math.floor(365.25*c),e=Math.floor((b-d2)/30.6001);
  const day=b-d2-Math.floor(30.6001*e)+f;
  const mo=e<14?e-1:e-13,yr=mo>2?c-4716:c-4715;
  const dd=Math.floor(day),hrs=(day-dd)*24+7; // về giờ ICT
  const dt=new Date(yr,mo-1,dd);dt.setHours(Math.floor(hrs),Math.round((hrs%1)*60));
  return dt;
}
// API cũ giữ nguyên tên: mặc định lấy 12:00 ICT của ngày đang xem
function moonPhase(date,hourICT){
  const h=(hourICT==null)?12:hourICT;
  const jd=jdAt(date,h);
  const m=moonAt(jd);
  const lastNew=findPhase(jd-30,0);
  const age=jd-lastNew;
  return{age:age<0?age+29.53:age,idx:m.idx,illum:m.illum,waxing:m.waxing,jd};
}
function nextNewMoon(date){const j=findPhase(jdAt(date,12)+1,0);return j==null?null:jdToDateObj(j);}
function nextFullMoon(date){const j=findPhase(jdAt(date,12)+1,180);return j==null?null:jdToDateObj(j);}
function getSeason(d){
  let m=d.getMonth()+1,dd=d.getDate();
  if((m==3&&dd>=20)||m==4||m==5||(m==6&&dd<21))return 0;
  if((m==6&&dd>=21)||m==7||m==8||(m==9&&dd<23))return 1;
  if((m==9&&dd>=23)||m==10||m==11||(m==12&&dd<21))return 2;
  return 3;
}
// 24 tiết khí: kinh độ mặt trời (độ). deg 0 = Xuân phân.
function sunLongDeg(jdn){
  let T=(jdn-2451545)/36525,T2=T*T,dr=PI/180;
  let M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  let L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);
  DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  return (((L0+DL)%360)+360)%360;
}
// tiết khí hiện tại (index 0-23) của ngày
function currentTermIdx(jd){
  // Lấy kinh độ Mặt Trời lúc CUỐI ngày (23:59 giờ VN): nếu mốc chuyển tiết rơi
  // bất kỳ lúc nào trong ngày thì ngày đó đã thuộc tiết mới — đúng cách lịch VN ghi.
  let deg=sunLongDeg(jd+0.5-7/24-1/1440);
  return Math.floor(deg/15)%24;
}
// tìm tiết khí kế tiếp và số ngày còn lại
function nextTerm(d){
  let jd0=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  let curIdx=currentTermIdx(jd0);
  let nextIdx=(curIdx+1)%24,nextDeg=nextIdx*15;
  for(let i=1;i<=30;i++){
    let jd=jd0+i;
    let a=sunLongDeg(jd-0.5-7/24),b=sunLongDeg(jd+0.5-7/24);
    let crossed = nextDeg===0 ? (a>350&&b<10) : (a<nextDeg&&b>=nextDeg);
    if(crossed)return{idx:nextIdx,days:i};
  }
  return{idx:nextIdx,days:null};   // không dò được: báo rõ, không đoán
}

// ═══════════════ COSMIC (theo ngày xem) ═══════════════
const UAGE=13.8e9;
const cosmicEv=[[13.8e9,"bigBang"],[13.6e9,"milkyWay"],[4.6e9,"solarSys"],[3.8e9,"lifeEarth"],[6.6e7,"dino"],[3e5,"human"]];
function yearsAgoToCosmic(ya){
  let frac=(UAGE-ya)/UAGE,doy=frac*365.25;
  let d=new Date(2000,0,1);d.setDate(d.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  return{date:d,hh,mm,doy};
}
// map ngày đang xem -> vị trí trong "năm vũ trụ"
function cosmicForDate(date){
  let y0=new Date(date.getFullYear(),0,1),y1=new Date(date.getFullYear()+1,0,1);
  let frac=(date-y0)/(y1-y0);
  // cosmic date = same fraction of the cosmic year
  let doy=frac*365.25;
  let cd=new Date(2000,0,1);cd.setDate(cd.getDate()+Math.floor(doy));
  let secs=(doy%1)*86400,hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60);
  // years since big bang at this fraction
  let ysbb=frac*UAGE;
  return{date:cd,hh,mm,frac,ysbb};
}

function drukUpcoming(d,t){

const COSMIC_GYA=[[13.787,'cBigBang'],[13.2,'cStars'],[11,'cMilkyWay'],[4.6,'cSolar'],[4.54,'cEarth'],[4.5,'cMoon'],[4.1,'cBioTrace'],[3.8,'cLife'],[3.4,'cPhoto'],[2.4,'cOxy'],[2.0,'cEuk'],[0.8,'cMulti'],[0.67,'cAnimal'],[0.55,'cArthro'],[0.53,'cFish'],[0.45,'cPlant'],[0.35,'cInsect'],[0.3,'cReptile'],[0.243,'cDino'],[0.2,'cMammal'],[0.15,'cBird'],[0.13,'cFlower'],[0.066,'cDinoEnd'],[0.0003,'cHuman']];

  if(g>=1)return LANG=='vi'?`≈ ${g.toFixed(g>=10?1:2).replace('.',',')} tỷ năm trước`:`≈ ${g.toFixed(g>=10?1:2)} billion yrs ago`;
  const m=Math.round(g*1000);
  return LANG=='vi'?`≈ ${m} triệu năm trước`:`≈ ${m} million yrs ago`;
}
// mốc của ngày đang xem: {today:mốc trùng hôm nay|null, prev, next, gyaNow}
function cosmicToday(d){
  const doy=doyOf(d);
  const gyaNow=13.787*(1-doy/365);
  let today=null,prev=null,next=null;
  for(const [g,k] of COSMIC_GYA){
    const md=Math.round(gyaToDoy(g));
    if(md===doy){today={g,k,doy:md};}
    else if(md<doy){prev={g,k,doy:md};}
    else if(!next){next={g,k,doy:md};}
  }
  return{doy,gyaNow:Math.max(0,gyaNow),today,prev,next};
}

  for(let i=0;i<490;i++){const dd=new Date(y,0,1+i);
    const l=solarToLunar(dd.getDate(),dd.getMonth()+1,dd.getFullYear(),7);

// vẽ pha trăng bằng SVG — đơn giản, sạch
function moonSVG(f,wax,size){
  const R=size/2-3,cx=size/2,cy=size/2;
  const a=Math.max(0.6,R*Math.abs(1-2*f));
  const s1=wax?1:0;
  const s2=wax?(f<0.5?0:1):(f<0.5?1:0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="#2B2822"/>

function tideExtremes(j){

  const now=new Date();
  for(let i=1;i<h.length-1;i++){
    if(h[i]==null||h[i-1]==null||h[i+1]==null)continue;
    const hi=h[i]>=h[i-1]&&h[i]>=h[i+1],lo=h[i]<=h[i-1]&&h[i]<=h[i+1];
    if(!hi&&!lo)continue;
    const d=new Date(tm[i]);
    if(d<now)continue;

function tideSpark(j){

  // đường sẽ được ngắt tại đó để người xem thấy rõ chỗ nào không có số liệu.
  for(let i=0;i<n;i++)vals.push(h[i]==null?null:h[i]);

  const mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;

  vals.forEach((v,i)=>{
    if(v==null){if(cur.length>1)segs.push(cur);cur=[];return}
    cur.push(`${(i/(n-1)*320).toFixed(1)},${(82-(v-mn)/sp*66).toFixed(1)}`);
  });

  const now=nowAtLoc(),i0=Math.max(0,Math.min(n-1,Math.round((now-new Date(tm[0]))/36e5)));
  const hasNow=vals[i0]!=null;

  if(v<=S[0][0])return `rgb(${S[0][1]})`;
  for(let i=1;i<S.length;i++){
    if(v<=S[i][0]){const [a,ca]=S[i-1],[b,cb]=S[i],k=(v-a)/(b-a);
      return `rgb(${ca.map((x,j)=>Math.round(x+(cb[j]-x)*k)).join(',')})`;}
  }
  return `rgb(${S[S.length-1][1]})`;
}
function windDial(deg,t){
  // Kim tron hai dau, khong mui nhon. Cham to = huong gio THOI TOI.
  const R=30,c=42,a=(deg+180)*Math.PI/180;   // Open-Meteo cho huong gio THOI TU
  const hx=c+Math.sin(a)*R*0.72, hy=c-Math.cos(a)*R*0.72;
  const tx=c-Math.sin(a)*R*0.72, ty=c+Math.cos(a)*R*0.72;
  const L=t.wxDirs;
  return `<svg class="wdial" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"
    stroke-linecap="round" stroke-linejoin="round">
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#ffffff40" stroke-width="1.5"/>
    <g fill="#ffffff8f" font-size="9" text-anchor="middle" font-family="inherit">
      <text x="${c}" y="9">${L[0]}</text><text x="81" y="${c+3.2}">${L[2]}</text>
      <text x="${c}" y="79">${L[4]}</text><text x="3" y="${c+3.2}">${L[6]}</text></g>
    <line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}"
      stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3.6" fill="#fff"/>
  </svg>`;
}
function sunArc(rise,set,now){
  // Cung ngay: cham chay tu moc den lan. Qua duong chan troi thi cham nam duoi.
  const W=150,H=64,y0=46,A=32;
  const k=Math.max(-0.12,Math.min(1.12,(now-rise)/Math.max(1,set-rise)));
  const x=10+k*(W-20), y=y0-Math.sin(Math.max(0,Math.min(1,k))*Math.PI)*A;
  return `<svg class="warc" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 ${y0} Q ${W/2} ${y0-A*2} ${W-10} ${y0}" fill="none" stroke="#ffffff45"
      stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="${y0}" x2="${W-4}" y2="${y0}" stroke="#ffffff2e" stroke-width="1.4"
      stroke-dasharray="0.1 6" stroke-linecap="round"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6" fill="#FFD98A"/>
  </svg>`;
}

// ═══ HOÀNG ĐẠO TÂY ═══════════════════════════════════════════════════════
// Truoc day man nay chi ghi ten cung va ngay — khong dinh gi toi ngay gio hay
// he lich, chu Duyet noi dung. Nhung dao sau thi no dinh RAT CHAT:
// kinh do Mat Troi la MOT con so. Tay cat vong do thanh 12 cung 30°, Dong cat
// dung vong do thanh 24 tiet khi 15°. Nen 12 moc "Mat Troi vao cung moi" chinh
// la 12 TRUNG KHI — va quy tac "thang am khong co trung khi thi la thang nhuan"
// chinh la quy tac dat thang nhuan cua lich Viet ma app dang dung o §2.2.
function termStartDay(idx,from,dir){
  let d=new Date(from);
  for(let i=0;i<400;i++){
    const cur=currentTermIdx(jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear()));
    const pv=new Date(d);pv.setDate(pv.getDate()-1);
    const prv=currentTermIdx(jdFromDate(pv.getDate(),pv.getMonth()+1,pv.getFullYear()));
    if(cur===idx&&prv!==idx)return new Date(d);
    d.setDate(d.getDate()+dir);
  }
  return null;
}
function lunarMonthSpan(d){
  let a=new Date(d);
  for(let i=0;i<32;i++){const l=solarToLunar(a.getDate(),a.getMonth()+1,a.getFullYear(),7);
    if(l.day===1)break;a.setDate(a.getDate()-1);}
  let b=new Date(a);b.setDate(b.getDate()+1);
  for(let i=0;i<32;i++){const l=solarToLunar(b.getDate(),b.getMonth()+1,b.getFullYear(),7);
    if(l.day===1)break;b.setDate(b.getDate()+1);}
  b.setDate(b.getDate()-1);
  return [a,b];
}
// Trong khoang [a,b] co ngay nao Mat Troi buoc sang cung moi (= trung khi) khong?
function signEntryIn(a,b){
  let d=new Date(a);
  while(d<=b){
    const cur=currentTermIdx(jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear()));
    const pv=new Date(d);pv.setDate(pv.getDate()-1);
    const prv=currentTermIdx(jdFromDate(pv.getDate(),pv.getMonth()+1,pv.getFullYear()));
    if(cur%2===0&&cur!==prv)return {d:new Date(d),term:cur,sign:cur/2};
    d.setDate(d.getDate()+1);
  }
  return null;
}
// Mot vong tron, hai cach cat: 24 vach tiet khi, 12 vach dai la moc vao cung.
function zodRing(deg,t){
  // Khung rong hon vong tron: nhan "Ha chi"/"Dong chi" nam hai ben, khung vua khit
  // thi chu bi cat mat mot nua.
  const CX=132,CY=100,R=74,P=Math.PI/180;
  const pt=(a,r)=>[(CX+Math.sin(a*P)*r).toFixed(1),(CY-Math.cos(a*P)*r).toFixed(1)];
  let g='';
  for(let i=0;i<24;i++){
    const big=i%2===0,a=i*15,[x1,y1]=pt(a,big?R-14:R-7),[x2,y2]=pt(a,R+(big?6:2));
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7A5C8E"
      stroke-width="${big?2.2:1.1}" opacity="${big?.85:.38}"/>`;
  }
  const [sx,sy]=pt(deg,R-7);
  const AN=['middle','start','middle','end'];
  const lb=[0,90,180,270].map((a,i)=>{const [x,y]=pt(a,R+(i%2?12:19));
    return `<text x="${x}" y="${y}" font-size="10" fill="#7A5C8E" opacity=".85"
      text-anchor="${AN[i]}" dominant-baseline="middle">${t.zodCard[i]}</text>`}).join('');
  return `<svg viewBox="0 0 264 200" width="100%" style="display:block;max-width:300px;margin:6px auto 2px">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#7A5C8E" stroke-width="1.2" opacity=".3"/>
    <circle cx="${CX}" cy="${CY}" r="${R-14}" fill="none" stroke="#7A5C8E" stroke-width="1" opacity=".18"/>
    ${g}${lb}
    <circle cx="${sx}" cy="${sy}" r="6.5" fill="#D4A017"/>
    <circle cx="${sx}" cy="${sy}" r="11" fill="none" stroke="#D4A017" stroke-width="1.2" opacity=".45"/>
  </svg>`;
}

// Nguyên tố THỨ TRONG TUẦN + nguyên tố CHÒM SAO MẶT TRĂNG → 10 tổ hợp có tên Tạng/Phạn.
// Nguồn: Kalacakra.org (Edward Henning, dựa Vimalaprabhā). Đã đối chiếu khớp lịch Drukpa chính thức.
function moonLon(jd){
  const T=(jd-2451545)/36525,dr=PI/180;
  let Lp=218.3164477+481267.88123421*T-0.0015786*T*T;
  let D=(297.8501921+445267.1114034*T-0.0018819*T*T)*dr;
  let M=(357.5291092+35999.0502909*T)*dr;
  let Mp=(134.9633964+477198.8675055*T+0.0087414*T*T)*dr;
  let F=(93.2720950+483202.0175233*T-0.0036539*T*T)*dr;
  let s=6288774*Math.sin(Mp)+1274027*Math.sin(2*D-Mp)+658314*Math.sin(2*D)
    +213618*Math.sin(2*Mp)-185116*Math.sin(M)-114332*Math.sin(2*F)
    +58793*Math.sin(2*D-2*Mp)+57066*Math.sin(2*D-M-Mp)+53322*Math.sin(2*D+Mp)
    +45758*Math.sin(2*D-M)-40923*Math.sin(M-Mp)-34720*Math.sin(D)
    -30383*Math.sin(M+Mp)+15327*Math.sin(2*D-2*F)-12528*Math.sin(Mp+2*F)
    +10980*Math.sin(Mp-2*F);
  return (((Lp+s/1e6)%360)+360)%360;
}

// Nguyên tắc: không gán cứng. Mưa ban đêm = 0 điểm. Ngưỡng hiện ≥45, tối đa 2 mục.
function specialToday(d,t){
  const out=[];
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const tb=tibetan(d),jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());

  // ① Ghi chú cá nhân
  for(const n of notesOn(d))
    out.push({sc:88,hub:0,title:'♥ '+noteTypeName(n.type)+' '+n.name,sub:t.spNoteToday,go:'setMain(0)'});
  if(!out.length){
    const up=notesUpcoming(d,3).filter(u=>u.days>0);
    if(up.length)out.push({sc:70,hub:0,title:'♥ '+noteTypeName(up[0].n.type)+' '+up[0].n.name,
      sub:t.spNoteSoon.replace('{n}',up[0].days).replace(/\b1 days\b/,'1 day'),go:'setMain(0)'});
  }

  // ② Thời tiết — chỉ tính khung 6h–21h
  if(WX&&WX.hourly&&WX.hourly.precipitation_probability){
    const H=WX.hourly;let best=-1,bi=-1;
    for(let i=0;i<H.time.length;i++){
      const dt=new Date(H.time[i]);
      if(!sameDay(dt,d))continue;
      const h=dt.getHours();if(h<6||h>21)continue;
      const p=H.precipitation_probability[i]??0;
      if(p>best){best=p;bi=i;}
    }
    if(best>=55&&bi>=0){
      const h=new Date(H.time[bi]).getHours();
      const sc=Math.round(30+(best-50)*1.2);
      const part=h<10?t.pMorning:(h<14?t.pNoon:(h<18?t.pAfternoon:t.pEvening));
      out.push({sc,hub:4,title:t.spRain.replace('{p}',part),
        sub:t.spRainSub.replace('{h}',pad(h)+'h').replace('{v}',best),go:'goExp(4)'});
    }
    if(WX.daily){
      const hi=Math.round(WX.daily.temperature_2m_max[0]),lo=Math.round(WX.daily.temperature_2m_min[0]);
      if(hi>=35)out.push({sc:60+(hi-35)*4,hub:4,title:t.spHot.replace('{t}',hi),sub:t.spHotSub,go:'goExp(4)'});
      else if(lo<=15)out.push({sc:55+(15-lo)*3,hub:4,title:t.spCold.replace('{t}',lo),sub:t.spColdSub,go:'goExp(4)'});
    }
  }

  // ③ Lễ lớn văn hóa + Phật giáo
  const cu=t.cult.find(e=>e[0]===lun.month&&e[1]===lun.day);
  const be=t.buddhaEv.find(e=>e[0]===lun.month&&e[1]===lun.day);
  // hai bảng có thể trùng ngày (vd Vu Lan) — chỉ lấy MỘT mục lễ
  if(cu)out.push({sc:82,hub:2,title:cu[2],sub:t.spCult,go:'goExp(2)',kind:'fest'});
  else if(be)out.push({sc:82,hub:2,title:be[2],sub:t.spBuddha,go:'goExp(2)',kind:'fest'});

  // ④ Düchen Tạng
  if(!tb.leap)for(const e of DUCHEN)if(tb.month===e[0]&&tb.day===e[1])
    out.push({sc:76,hub:3,title:t[e[2]],sub:t.spDuchen,go:'goExp(3)'});

  // ⑤ Rằm / mùng 1
  if(!out.some(x=>x.kind==='fest')){
    if(lun.day===15)out.push({sc:66,hub:1,title:t.fullDay,sub:t.spFull,go:'goExp(0)'});
    else if(lun.day===1)out.push({sc:66,hub:1,title:t.newDay,sub:t.spNew,go:'goExp(0)'});
  }

  // ⑥ Chuyển tiết khí
  const ct=currentTermIdx(jd);
  if(ct!==currentTermIdx(jd-1))
    out.push({sc:58,hub:2,title:t.terms[ct],sub:t.spTerm,go:'goExp(0)'});

  // ⑦ Ngày thực hành Tạng
  // Truoc day cho nay chep tay [8,10,15,25,30] — thieu ngay 29 (Ho phap), lech
  // voi bang drukDays that. Do duoc: 72 ngay thuc hanh trong nam, mat tien chi
  // nhac 55. Gio doc thang tu drukSpecialName nen hai cho khong the lech nua.
  const tênTH=(!tb.leap)?drukSpecialName(tb,t):null;
  if(tênTH&&!out.some(x=>x.hub===3))
    out.push({sc:48,hub:3,title:tênTH,sub:t.spTibSub,go:'goExp(3)'});

  // sắp theo điểm, nhưng 2 mục hiển thị phải khác nguồn (không dồn 2 mục cùng hub)
  const sorted=out.filter(x=>x.sc>=45).sort((a,b)=>b.sc-a.sc);
  const pick=[];
  for(const x of sorted){
    if(pick.length>=2)break;
    if(pick.some(y=>y.hub===x.hub))continue;
    pick.push(x);
  }
  // nếu chỉ có 1 nguồn mà còn chỗ, lấy thêm mục điểm cao kế tiếp
  if(pick.length<2)for(const x of sorted){
    if(pick.length>=2)break;
    if(!pick.includes(x))pick.push(x);
  }
  return pick;
}

function dailyLine(d,t){
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const tb=tibetan(d),mp=moonPhase(d);
  const jd=jdFromDate(d.getDate(),d.getMonth()+1,d.getFullYear());
  // 0) lễ lớn văn hóa / Phật giáo — hôm đó câu của ngày phải là chính ngày lễ
  const cuF=t.cult.find(e=>e[0]===lun.month&&e[1]===lun.day);
  const beF=t.buddhaEv.find(e=>e[0]===lun.month&&e[1]===lun.day);
  if(cuF||beF){const nm=(cuF||beF)[2];
    return{txt:(LANG=='vi'?'Hôm nay là ':'Today is ')+nm+(LANG=='vi'?' — ngày '+lun.day+'/'+lun.month+' âm lịch.':' — lunar '+lun.day+'/'+lun.month+'.'),
      lens:cuF?t.lensViet:t.lensBuddha,src:t.srcEdited,go:()=>'goExp(2)'};}
  // 1) ngày thực hành Tạng
  const tl=!tb.leap&&LINES.tibet[String(tb.day)];
  if(tl)return{txt:tl[LANG],lens:t.lensTibet,src:t.srcEdited,go:()=>'goExp(3)'};
  // 2) rằm / mùng 1 → Phật giáo (câu có nguồn)
  if(lun.day===15||lun.day===1){
    const q=LINES.buddha[jd%LINES.buddha.length];
    return{txt:'“'+q[LANG]+'”',lens:t.lensBuddha,src:LANG=='vi'?q.src:q.srcEn,go:()=>'goExp(2)'};
  }
  // 3) ngày bắt đầu tiết khí → Lịch Việt
  const ct=currentTermIdx(jd),ctY=currentTermIdx(jd-1);
  if(ct!==ctY)return{txt:t.lineTerm.replace('{t}',t.terms[ct]),lens:t.lensViet,src:t.srcEdited,go:()=>'goExp(0)'};
  // 4) mặc định → thiên văn
  let k='wax';
  if(mp.illum>0.985)k='full';else if(mp.illum<0.015)k='newm';else k=mp.waxing?'wax':'wane';

// ① thời tiết
// Giờ hiện tại TẠI ĐỊA ĐIỂM đang xem (Open-Meteo trả timezone=auto + utc_offset_seconds).
// Nếu máy ở múi giờ khác nơi xem, không được lấy giờ máy để so.
function nowAtLoc(){
  const off=(WX&&typeof WX.utc_offset_seconds==='number')?WX.utc_offset_seconds:null;
  if(off===null)return new Date();
  const utcMs=Date.now();
  const locMs=utcMs+off*1000;
  const d=new Date(locMs);
  // trả về Date mang "giờ tường" của địa điểm, đọc bằng getUTC*
  return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());
}
// Câu tóm tắt hôm nay: ngôn ngữ người, sinh từ forecast — không phán vận
function todaySentence(t){
  if(!WX||!WX.current||!WX.daily)return null;
  const c=WX.current,dl=WX.daily,H=WX.hourly;
  const hi=Math.round(dl.temperature_2m_max[0]),lo=Math.round(dl.temperature_2m_min[0]);
  const pop=dl.precipitation_probability_max[0]??0;
  // mưa vào buổi nào?
  let part=null;
  if(H&&H.precipitation_probability){
    const now=nowAtLoc();let i0=H.time.findIndex(x=>new Date(x)>=now);if(i0<0)i0=0;
    let best=-1,bi=-1;
    for(let i=i0;i<Math.min(i0+14,H.time.length);i++){
      const p=H.precipitation_probability[i]??0;
      if(p>best){best=p;bi=i;}
    }
    if(best>=55&&bi>=0){
      const h=new Date(H.time[bi]).getHours();
      part=h<10?t.pMorning:(h<14?t.pNoon:(h<18?t.pAfternoon:t.pEvening));
    }
  }
  let head,adv='';
  if(pop>=70){head=t.sRainy;adv=part?t.aRainSure.replace('{p}',part):t.aRain;}
  else if(pop>=40){head=t.sShower;adv=part?t.aRainMaybe.replace('{p}',part):t.aShower;}
  else if(hi>=33){head=t.sHot;adv=t.aHot;}
  else if(hi<=22){head=t.sCool;adv=t.aCool;}
  else{head=t.sClear;adv=t.aClear;}
  return{head,adv,hi,lo,set:dl.sunset[0].slice(11,16)};
}

function almanac(){
  const d=VIEW,t=T[LANG];
  const lun=solarToLunar(d.getDate(),d.getMonth()+1,d.getFullYear(),7);
  const cyD=ccDay(lun.jd),cyM=ccMonth(lun.year,lun.month),cyY=ccYear(lun.year);
  const now=new Date(),isToday=sameDay(d,now),curH=isToday?now.getHours():0;
  const cyH=ccHour(lun.jd,curH);
  const na=napAm(cyD[0],cyD[1]),tú=tu28(lun.jd),trực=truc12(lun),hd=dayHoangDao(d);
  const lucky=luckyChiSet(cyD[1]);
  const cc=(x)=>t.can[x[0]]+' '+t.chi[x[1]];
  const sh=(ic,ttl)=>'<div class="sh"><span class="ic">'+svgIcon(ic,17,1.9)+'</span><h3>'+ttl+'</h3></div>';
  const glo1=(k)=>' <i class="gl" role="button" tabindex="0" aria-label="Giải nghĩa" onclick="event.stopPropagation();glo(\''+k+'\')">ⓘ</i>';

  // Dau trang: NGAY · THANG · NAM — gia tri xanh, to, nhu anh doi chieu
  const đầu='<div class="sect"><div class="g3">'
    +'<div><em>'+t.sNgay+'</em><b>'+cc(cyD)+'</b></div>'
    +'<div><em>'+t.sThang+'</em><b>'+cc(cyM)+'</b></div>'
    +'<div><em>'+t.sNam+'</em><b>'+cc(cyY)+'</b></div></div>'
    +'<div class="g3 hts">'
    +'<div>'+(LANG=='vi'?'Hành':'Element')+': <b>'+hanhNgay(cyD)+'</b></div>'
    +'<div>'+(LANG=='vi'?'Trực':'Duty')+': <b>'+(LANG=='vi'?TRUC_VI:TRUC_EN)[trực]+'</b></div>'
    +'<div>Sao: <b>'+TU28_VI[tú]+'</b></div></div>'
    +'<div class="rows"><div class="row"><span class="k">'+t.napAm+glo1('napam')+'</span><span class="v"><b>'+t.napam[na]+'</b></span></div>'
    +'<div class="row"><span class="k">'+t.zodiac+'</span><span class="v">'+t.animals[cyY[1]]+'</span></div>'
    +'<div class="row"><span class="k">'+t.ccHour+(isToday?'':' ('+(LANG=='vi'?'giờ Tý':'Zi')+')')+'</span><span class="v">'+cc(cyH)+'</span></div></div></div>';

  // TOM TAT NGAY: app pho thong dua du lieu roi bat nguoi dung tu tong hop.

  const tómTắt='<div class="sect tt '+(hd.good?'g':'b')+'">'
    +'<div class="ttl1"><b class="'+(hd.good?'good':'bad')+'">'+(hd.good?t.hdGood:t.hdBad)

    +(TU28_CAT[tú]?t.catTu.replace(LANG=='vi'?'sách lịch xếp: ':'almanac: ',''):t.hungTu.replace(LANG=='vi'?'sách lịch xếp: ':'almanac: ',''))

  let bâyGiờ='';
  if(isToday){
    const ch=Math.floor(((now.getHours()+1)%24)/2);

const CHAY=[[1,15],[1,14,15,30],[8,14,15,23,29,30],[1,8,14,15,18,23,24,28,29,30],null];
let CHAYMODE=(function(){try{const v=localStorage.getItem('ldc_chay');return v===null?3:+v}catch(e){return 3}})();
function lunarMonthLen(d){const sp=lunarMonthSpan(d);return Math.round((sp[1]-sp[0])/864e5)+1;}
// Thang thieu (29 ngay) thi ngay 30 giu vao ngay 29 — ngay cuoi thang.
function chayDays(mode,len){
  const base=CHAY[mode];if(!base)return null;
  const o=[];for(const x of base){const y=(x===30&&len===29)?29:x;if(o.indexOf(y)<0)o.push(y);}
  return o.sort(function(a,b){return a-b});
}
function nextChay(d,mode){
  if(mode===4)return null;
  const cache={};
  for(let i=1;i<=32;i++){
    const x=new Date(d);x.setDate(x.getDate()+i);
    const l=solarToLunar(x.getDate(),x.getMonth()+1,x.getFullYear(),7);
    const k=l.year+'/'+l.month+'/'+(l.leap?1:0);
    const len=cache[k]||(cache[k]=lunarMonthLen(x));
    const days=chayDays(mode,len);
    if(days.indexOf(l.day)>=0)return {n:i,day:l.day,len:len,d:x};
  }
  return null;
}
function lunarDayName(day,len,t){
  if(day===1)return t.dayFirst;
  if(day===15)return t.dayFull;
  if(day===len)return t.dayLast;
  return t.dayN.replace('{n}',day);
}

      +'<div class="k2">'+(special?t.tibPractice:t.tibLbl)+'</div>'
      +'<div class="v2">'+đầuĐề+'</div>'
      +'<div class="s2">'+dòngPhụ+'</div>'
      // Mau khong duoc thay chu: ngay Duchen phai co CHU noi ro, khong chi doi nen.
      +(dc?'<div style="margin-top:11px"><span class="tag jade">'+svgIcon('star',13,2)+' '+t.tibSpecialTag+'</span></div>':'')
    +'</div>'
    +ornMountain('#2E3446','#3A4157')
    +'<div class="bd2">'
      +'<div class="tstrip">'+dải+'</div>'
      +(dc?'<div class="merit">'+t.duchenMerit+'</div>'
         :(special?'<div class="explain2" style="margin:0 0 12px">'+t.sacredMean+'</div>'
                 :'<div class="explain2" style="margin:0 0 12px">'+t.tibOrdSub+'</div>'))
      +(kế?'<button class="nextp" onclick="goDay('+kế.d.getFullYear()+','+(kế.d.getMonth()+1)+','+kế.d.getDate()+')">'
            +'<span class="k">'+(kế.n===1?t.tibNextP1:t.tibNextP.replace('{n}',kế.n)).replace('{d}',kế.nm)+'</span>'
            +svgIcon('chevR',16,2)+'</button>':'')
      +(tib.doubled?'<div class="row"><span class="k">'+t.lhagLbl+'</span><span class="v">'+(tib.leapDay?t.lhagLeap:t.lhagMain)+'</span></div>':'')
      +(tib.prevSkipped?'<div class="row"><span class="k">'+t.chadLbl+'</span><span class="v">'+t.chadTxt+'</span></div>':'')
    +'</div>'
  +'</div>'
  +'<div class="card">'
    +'<h2>'+t.upcoming+'</h2><div class="en">Düchen · Losar</div>'
    +'<div class="up">'+up.map(function(u){
        const p=u[2].split('-');
        return '<button class="u" onclick="goDay('+(+p[0])+','+(+p[1])+','+(+p[2])+')">'
          +'<span class="un">'+u[1]+'<em>'+(+p[2])+'/'+(+p[1])+'/'+p[0]+'</em></span>'
          +'<span class="ud">'+(u[0]===0?t.today:u[0]+' '+(LANG=='vi'?'ngày':'d'))+'</span>'
          +svgIcon('chevR',15,2)+'</button>'}).join('')+'</div>'
    +'<div class="note">'+t.drukNote+'</div>'
  +'</div>'
  +dChi;
}


// ═══════════════ NAV / CONTROLS ═══════════════
function renderMainTabs(){
  let t=T[LANG],ic=['today','cal','wheel','sun','star'],mt=document.getElementById('maintabs');
  mt.innerHTML=t.mains.map((m,i)=>
    `<button class="${i===MAIN?'on':''}" onclick="setMain(${i})" aria-label="${m}" ${i===MAIN?'aria-current="page"':''}><span class="bi" aria-hidden="true">${svgIcon(ic[i])}</span>${m}</button>`).join('');
}
function renderScreen(){
  let fns=[screenToday,screenCalendar,screenExplore,screenWeatherTab,screenEvents];
  document.getElementById('screens').innerHTML=`<div class="screen on">${fns[MAIN]()}</div>`;
}
function setMain(i){if(i===0){VIEW=new Date();syncGYM();}if(i!==1)DETAIL=false;
  // Panel dang mo co thuoc ve tab vua bam khong? Khong thi dong lai.
  if(EXPOPEN&&EXP_TAB[SUBEXP]!==i)EXPOPEN=false;document.body.className='';MAIN=i;track('tab_open',['today','calendar','systems','weather','events'][i]);renderMainTabs();renderScreen();window.scrollTo(0,0);}
function setSubCal(i){SUBCAL=i;track('tab_open','calendar:'+['vannien','canchi','buddha'][i]);renderScreen();}
function setSubExp(i){SUBEXP=i;track('tab_open','explore:'+['moon','cosmic','buddha','tibet','weather','tide'][i]);renderScreen();}
function goCal(i){SUBCAL=i;setMain(1);}
function goExp(i){SUBEXP=i;EXPOPEN=true;setMain(EXP_TAB[i]);}
// Thay mot moc thoi gian ma cham vao khong di dau la cut. Cham -> ca app
// chuyen sang dung ngay do, van o nguyen man dang xem.
function goDay(y,m,dd){VIEW=new Date(+y,+m-1,+dd);renderScreen();window.scrollTo(0,0);}
function goDayOff(n){const x=new Date(VIEW);x.setDate(x.getDate()+(+n));
  VIEW=x;renderScreen();window.scrollTo(0,0);}
// Bo chuyen doi ngay doc thang VIEW, nen chi can dan sang la no mang theo
// ngay dang xem — khong bat nguoi dung go lai thu app vua biet.
function goConvert(){MODE='convert';SUBCAL=0;setMain(1);}

function shiftDay(n){VIEW=new Date(VIEW.getTime()+n*864e5);syncGYM();track('date_select','arrow');renderScreen();}
function pickDate(){let v=document.getElementById('dp').value;if(v){VIEW=new Date(v+'T12:00:00');syncGYM();track('date_select','picker');renderScreen();}}

function setLang(l){
  LANG=l;track('language_change',l);
  document.getElementById('lvi').classList.toggle('on',l=='vi');
  document.getElementById('len').classList.toggle('on',l=='en');
  document.getElementById('brandName').textContent=T[l].brand;
  document.getElementById('footNote').innerHTML=T[l].foot;
  document.documentElement.lang=l;
  renderMainTabs();renderScreen();
}

// stars
(function(){let s=document.getElementById('stars'),h='';
  for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s"></i>`;
  s.innerHTML=h;})();

document.getElementById('footNote').innerHTML=T.vi.foot;
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    // Trang dang mo san khi ban moi len: bao mot dong nho, de nguoi dung tu bam.
    // Tu nap lai giua chung thi cuop mat cho ho dang doc.
    function moi(){
      if(document.getElementById('newver'))return;
      var t=T[LANG],d=document.createElement('div');
      d.id='newver';d.innerHTML='<span>'+t.newVer+'</span><button onclick="location.reload()">'+t.newVerGo+'</button>';
      document.body.appendChild(d);
    }
    reg.addEventListener('updatefound',function(){
      var w=reg.installing;if(!w)return;
      w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller)moi();
      });
    });
    // Mo lai app sau khi de o nen: hoi may chu xem co ban moi khong.
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible')reg.update().catch(function(){});
    });
  }).catch(function(){});
}
trackVisit();
if(loadLoc()){fetchWeather();fetchTide();}
renderMainTabs();renderScreen();
</script>
